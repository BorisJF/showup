<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOW UP</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #ede8df;
      --text:        #28201a;
      --muted:       #9a8b7b;
      --amber:       #b8773a;
      --amber-light: rgba(184, 119, 58, 0.10);
      --card:        #ffffff;
      --card-border: rgba(40, 32, 26, 0.09);
      --card-shadow: 0 1px 4px rgba(40, 32, 26, 0.08);
      --badge-bg:    #ddd5c6;
      --rule-color:  rgba(184, 119, 58, 0.45);
    }

    html { background: var(--bg); }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      font-size: 16px;
      line-height: 1.55;
      max-width: 500px;
      margin: 0 auto;
      padding: 28px 20px 88px;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    #app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .date-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border-radius: 100px;
      padding: 7px 14px 7px 11px;
      box-shadow: 0 1px 6px rgba(40, 32, 26, 0.13);
    }

    .streak-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
      flex-shrink: 0;
    }

    .streak-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
    }

    .streak-milestone-line {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      color: var(--amber);
      text-align: right;
      margin-top: 5px;
      letter-spacing: 0.08em;
      min-height: 14px;
    }

    /* ── GREETING ── */
    .greeting {
      text-align: center;
      font-size: 18px;
      font-style: italic;
      color: var(--text);
      margin-bottom: 26px;
    }

    /* ── REMEMBER THIS ── */
    .remember-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .remember-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 14px;
    }

    .remember-line1 {
      font-size: 29px;
      font-weight: 400;
      line-height: 1.25;
      color: var(--text);
    }

    .remember-line2 {
      font-size: 31px;
      font-weight: 500;
      font-style: italic;
      line-height: 1.25;
      color: var(--amber);
    }

    .remember-rule {
      width: 38px;
      height: 2px;
      background: var(--rule-color);
      margin: 18px auto 0;
      border-radius: 1px;
    }

    /* ── SECTION HEADER + LINE ── */
    .section-header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: rgba(40, 32, 26, 0.12);
    }

    /* ── FOCUS CARDS ── */
    .focus-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      margin-bottom: 10px;
      transition: border-color 0.14s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .focus-card.selected {
      border-color: var(--amber);
    }

    .letter-badge {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 10px;
      background: var(--badge-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 600;
      font-style: normal;
      color: var(--text);
      font-family: 'Lora', Georgia, serif;
    }

    .card-name {
      flex: 1;
      font-size: 16px;
      font-weight: 400;
      font-style: normal;
      color: var(--text);
    }

    .radio-circle {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 2px solid rgba(40, 32, 26, 0.20);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.14s, background 0.14s;
    }

    .focus-card.selected .radio-circle {
      border-color: var(--amber);
      background: var(--amber);
    }

    .focus-card.selected .radio-circle::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
    }

    /* ── COMMITMENT TEXTAREA ── */
    .commitment-group {
      margin-top: 26px;
    }

    .field-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      display: block;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      color: var(--text);
      font-family: 'Lora', Georgia, serif;
      font-size: 16px;
      padding: 14px 16px;
      outline: none;
      resize: none;
      min-height: 88px;
      line-height: 1.55;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.14s;
    }

    textarea:focus {
      border-color: rgba(40, 32, 26, 0.28);
    }

    textarea::placeholder {
      color: rgba(40, 32, 26, 0.22);
      font-style: italic;
    }

    /* ── COMMIT BUTTON ── */
    .commit-btn {
      width: 100%;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: 17px;
      cursor: pointer;
      margin-top: 14px;
      transition: opacity 0.12s;
    }

    .commit-btn:hover  { opacity: 0.88; }
    .commit-btn:active { opacity: 0.72; }
    .commit-btn:disabled { opacity: 0.32; cursor: not-allowed; }

    .error-msg {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px;
      color: #b03030;
      margin-top: 10px;
    }

    /* ── LOCKED ENTRY ── */
    .locked-field {
      margin-bottom: 20px;
    }

    .locked-value {
      font-size: 17px;
      line-height: 1.55;
      color: var(--text);
    }

    /* ── DAILY MESSAGE ── */
    .message-card {
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      box-shadow: var(--card-shadow);
      padding: 20px;
      margin-top: 22px;
    }

    .message-mode {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 10px;
    }

    .message-text {
      font-size: 17px;
      font-style: italic;
      line-height: 1.62;
      color: var(--text);
    }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: rgba(40, 32, 26, 0.10);
      margin: 38px 0;
    }

    /* ── RECENT MORNINGS ── */
    .morning-entry {
      padding: 14px 0;
      border-bottom: 1px solid rgba(40, 32, 26, 0.08);
    }

    .morning-entry:last-child { border-bottom: none; }

    .morning-date {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .morning-focus {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .morning-commitment {
      font-size: 14px;
      color: var(--muted);
      font-style: italic;
      line-height: 1.4;
    }

    .empty-state {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 14px;
      color: var(--muted);
    }

    /* ── MORNING RATING DOTS (history) ── */
    .morning-rating {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      align-items: center;
    }

    .morning-rating-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(40, 32, 26, 0.12);
    }

    .morning-rating-dot.filled {
      background: var(--amber);
    }

    /* ── RATING SCREEN ── */
    .rating-context {
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 32px;
    }

    .rating-context-date {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 8px;
    }

    .rating-context-focus {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .rating-context-commitment {
      font-size: 14px;
      color: var(--muted);
      font-style: italic;
      line-height: 1.4;
    }

    .rating-btn-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .rating-tap-btn {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: none;
      background: var(--badge-bg);
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: transform 0.1s ease;
    }

    .rating-ring-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: rotate(-90deg);
      pointer-events: none;
    }

    .rating-ring-bg {
      fill: none;
      stroke: rgba(40, 32, 26, 0.08);
      stroke-width: 6;
    }

    .rating-ring-fill {
      fill: none;
      stroke: var(--amber);
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.25s ease, stroke 0.25s ease;
    }

    .rating-number {
      font-family: 'Lora', Georgia, serif;
      font-size: 40px;
      font-weight: 500;
      color: var(--text);
      position: relative;
      z-index: 1;
      transition: color 0.2s;
      pointer-events: none;
    }

    .rating-hint {
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
      min-height: 20px;
      margin-bottom: 22px;
      transition: opacity 0.2s;
    }

    .rating-skip {
      display: block;
      margin: 0 auto;
      background: none;
      border: none;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      cursor: pointer;
      padding: 8px 12px;
      opacity: 0.65;
      letter-spacing: 0.04em;
    }

    .rating-skip:hover { opacity: 1; }

    /* ── MILESTONE CELEBRATION ── */
    .milestone-overlay {
      position: fixed;
      inset: 0;
      background: rgba(237, 232, 223, 0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      overflow: hidden;
      animation: ms-fade-in 0.5s ease forwards;
    }

    .milestone-overlay.hiding {
      animation: ms-fade-out 0.7s ease forwards;
      pointer-events: none;
    }

    @keyframes ms-fade-in  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes ms-fade-out { from { opacity: 1; } to { opacity: 0; } }

    .milestone-day-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--amber);
      animation: ms-rise 0.7s 0.1s ease both;
    }

    .milestone-number {
      font-family: 'Lora', Georgia, serif;
      font-size: 108px;
      font-weight: 600;
      color: var(--text);
      line-height: 1;
      animation: ms-pop 0.65s 0.15s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .milestone-message {
      font-family: 'Lora', Georgia, serif;
      font-size: 20px;
      font-style: italic;
      color: var(--text);
      text-align: center;
      max-width: 290px;
      line-height: 1.45;
      margin-top: 18px;
      animation: ms-rise 0.7s 0.35s ease both;
    }

    .milestone-dismiss {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-top: 52px;
      animation: ms-rise 0.7s 0.65s ease both;
    }

    @keyframes ms-pop {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    @keyframes ms-rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    .ms-particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: ms-particle-float linear forwards;
    }

    @keyframes ms-particle-float {
      0%   { opacity: 0.75; transform: translateY(0)     translateX(0)            scale(1);   }
      100% { opacity: 0;    transform: translateY(-300px) translateX(var(--drift)) scale(0.2); }
    }

    /* ── LOADING ── */
    .loading {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px;
      color: var(--muted);
    }

    /* ── SIMULATE (testing only) ── */
    .test-area {
      margin-top: 52px;
      text-align: center;
    }

    .simulate-btn {
      background: transparent;
      border: 1px solid rgba(40, 32, 26, 0.15);
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }

    .simulate-btn:hover {
      color: var(--text);
      border-color: rgba(40, 32, 26, 0.3);
    }

    .simulate-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- HEADER: date + streak pill -->
  <div id="app-header">
    <div class="date-label" id="date-display">—</div>
    <div>
      <div class="streak-pill">
        <div class="streak-dot"></div>
        <span class="streak-pill-text" id="streak-pill-text">0 -day streak</span>
      </div>
      <div class="streak-milestone-line" id="streak-milestone"></div>
    </div>
  </div>

  <!-- GREETING -->
  <div class="greeting" id="greeting">Good morning.</div>

  <!-- REMEMBER THIS -->
  <div class="remember-section">
    <div class="remember-label">Remember this</div>
    <div class="remember-line1" id="remember-line1"></div>
    <div class="remember-line2" id="remember-line2"></div>
    <div class="remember-rule"></div>
  </div>

  <!-- TODAY'S CHECK-IN (fresh or committed state) -->
  <div id="checkin-section">
    <div class="loading">Loading...</div>
  </div>

  <!-- RECENT MORNINGS -->
  <div class="section-header-row">
    <span class="section-label">Recent mornings</span>
    <div class="section-line"></div>
  </div>
  <div id="history-section">
    <div class="loading">...</div>
  </div>


  <script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // CONTENT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    const PRINCIPLES = [
      { letter: 'S', name: 'Smile and be nice' },
      { letter: 'H', name: 'Hold their gaze' },
      { letter: 'O', name: 'Own it — you can fix it' },
      { letter: 'W', name: "Watch who you're around" },
      { letter: 'U', name: 'Use this moment to act' },
      { letter: 'P', name: 'Present is where you need to be' },
    ];

    // Daily affirmations for "Remember this" — rotate by date
    const AFFIRMATIONS = [
      { line1: 'You have a superpower:',            line2: 'making people feel special.' },
      { line1: 'Your instincts have earned their keep:', line2: 'trust them today.' },
      { line1: 'The room changes when you walk in:', line2: 'show up fully.' },
      { line1: "You've been through harder things:", line2: 'you already know how.' },
      { line1: 'The work you do quietly',            line2: 'matters more than you think.' },
      { line1: 'Your presence is a gift —',          line2: "don't forget to give it." },
      { line1: "You don't need all the answers.",    line2: 'You need the next step.' },
    ];

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // DATE UTILS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function getTodayDate() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getYesterdayDate() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('en-US', {
        weekday: 'long', month: 'long', day: 'numeric'
      }).toUpperCase();
    }

    function getGreeting() {
      const h = new Date().getHours();
      if (h >= 4 && h < 12) return 'Good morning.';
      if (h >= 12 && h < 18) return 'Good afternoon.';
      return 'Good evening.';
    }

    function getDailyAffirmation(dateStr) {
      const seed = dateStr.replace(/-/g, '').split('').reduce((a, c) => a + c.charCodeAt(0), 0);
      return AFFIRMATIONS[seed % AFFIRMATIONS.length];
    }

    function getMilestone(streak) {
      if (streak >= 100) return '✦  100-day mark';
      if (streak >= 30)  return '◆  30-day mark';
      if (streak >= 7)   return '◇  7-day mark';
      return '';
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // RENDER
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function renderHeader(date, streak) {
      document.getElementById('date-display').textContent = formatDate(date);
      document.getElementById('greeting').textContent = getGreeting();

      // Affirmation
      const aff = getDailyAffirmation(date);
      document.getElementById('remember-line1').textContent = aff.line1;
      document.getElementById('remember-line2').textContent = aff.line2;

      // Streak
      const s = (streak !== null && streak !== undefined) ? streak : 0;
      document.getElementById('streak-pill-text').textContent = `${s} -day streak`;
      document.getElementById('streak-milestone').textContent = getMilestone(s);
    }

    function renderFreshDay() {
      selectedFocus = null;

      const cards = PRINCIPLES.map(p => `
        <div class="focus-card" data-name="${esc(p.name)}" onclick="selectCard(this)">
          <div class="letter-badge">${p.letter}</div>
          <div class="card-name">${esc(p.name)}</div>
          <div class="radio-circle"></div>
        </div>
      `).join('');

      document.getElementById('checkin-section').innerHTML = `
        <div class="section-header-row">
          <span class="section-label">Choose today's focus</span>
          <div class="section-line"></div>
        </div>

        ${cards}

        <div class="commitment-group">
          <label class="field-label" for="commitment-input">Commit to the day</label>
          <textarea
            id="commitment-input"
            placeholder="Write it down — even one line."
            rows="3"
          ></textarea>
        </div>

        <button class="commit-btn" id="commit-btn" onclick="handleCommit()">
          Commit to the day
        </button>
        <div class="error-msg" id="error-msg" style="display:none"></div>
      `;
    }

    function selectCard(card) {
      document.querySelectorAll('.focus-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedFocus = card.dataset.name;
    }

    function renderCommittedDay(entry) {
      const mode = entry.message_mode
        ? entry.message_mode.charAt(0).toUpperCase() + entry.message_mode.slice(1)
        : 'Message';

      document.getElementById('checkin-section').innerHTML = `
        <div class="section-header-row">
          <span class="section-label">Today's focus</span>
          <div class="section-line"></div>
        </div>
        <div class="locked-field">
          <div class="locked-value">${esc(entry.focus)}</div>
        </div>

        <div class="section-header-row" style="margin-top:20px">
          <span class="section-label">Your commitment</span>
          <div class="section-line"></div>
        </div>
        <div class="locked-field">
          <div class="locked-value">${esc(entry.commitment)}</div>
        </div>

        ${entry.daily_message ? `
          <div class="message-card">
            <div class="message-mode">${esc(mode)}</div>
            <div class="message-text">${esc(entry.daily_message)}</div>
          </div>
        ` : ''}
      `;
    }

    function renderHistory(history) {
      const el = document.getElementById('history-section');
      if (!history || history.length === 0) {
        el.innerHTML = '<div class="empty-state">Your committed mornings will gather here.</div>';
        return;
      }
      el.innerHTML = history.map(e => {
        const ratingDots = (e.rating !== null && e.rating !== undefined)
          ? `<div class="morning-rating">${[1,2,3,4,5].map(i =>
              `<div class="morning-rating-dot${i <= e.rating ? ' filled' : ''}"></div>`
            ).join('')}</div>`
          : '';
        return `
          <div class="morning-entry">
            <div class="morning-date">${formatDate(e.date)}</div>
            <div class="morning-focus">${esc(e.focus)}</div>
            <div class="morning-commitment">${esc(e.commitment)}</div>
            ${ratingDots}
          </div>
        `;
      }).join('');
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // SELF-RATING
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    // Set to true once the rating prompt has been handled this session
    // (prevents the prompt re-appearing if loadApp is called again, e.g. after submit)
    let ratingPromptHandled = false;

    const RATING_CIRCUMFERENCE = 2 * Math.PI * 56; // radius 56 inside 130px button

    const RATING_HINTS = [
      'Tap to rate',
      "I barely tried…",
      'Made some effort',
      'Good showing',
      'Showed up well',
      'Like a rock star! ⭐'
    ];

    const RATING_COLORS = [
      'rgba(184,119,58,0)',
      'rgba(184,119,58,0.30)',
      'rgba(184,119,58,0.50)',
      'rgba(184,119,58,0.70)',
      'rgba(184,119,58,0.88)',
      'rgba(184,119,58,1.00)',
    ];

    function renderRatingScreen(yesterday) {
      document.getElementById('checkin-section').innerHTML = `
        <div class="section-header-row">
          <span class="section-label">How did yesterday go?</span>
          <div class="section-line"></div>
        </div>

        <div class="rating-context">
          <div class="rating-context-date">${formatDate(yesterday.date)}</div>
          <div class="rating-context-focus">${esc(yesterday.focus)}</div>
          <div class="rating-context-commitment">${esc(yesterday.commitment)}</div>
        </div>

        <div class="rating-btn-wrap">
          <button class="rating-tap-btn" id="rating-tap-btn" onclick="handleRatingTap()">
            <svg class="rating-ring-svg" viewBox="0 0 130 130">
              <circle class="rating-ring-bg" cx="65" cy="65" r="56"/>
              <circle class="rating-ring-fill" id="rating-ring" cx="65" cy="65" r="56"
                stroke-dasharray="${RATING_CIRCUMFERENCE.toFixed(2)}"
                stroke-dashoffset="${RATING_CIRCUMFERENCE.toFixed(2)}"/>
            </svg>
            <span class="rating-number" id="rating-number">0</span>
          </button>
        </div>

        <div class="rating-hint" id="rating-hint">Tap to rate</div>

        <button class="rating-skip" onclick="handleRatingSkip()">skip →</button>
      `;

      // State lives on a plain object (not window) to avoid leaks
      window.__ratingState = { date: yesterday.date, current: 0, timer: null };
    }

    function handleRatingTap() {
      const state = window.__ratingState;
      if (!state) return;

      // Cycle 0 → 1 → 2 → 3 → 4 → 5 → 0
      state.current = (state.current + 1) % 6;

      const { current } = state;

      // Update ring
      const offset = RATING_CIRCUMFERENCE * (1 - current / 5);
      const ring = document.getElementById('rating-ring');
      ring.style.strokeDashoffset = offset;
      ring.style.stroke = RATING_COLORS[current];

      // Update number
      document.getElementById('rating-number').textContent = current;

      // Update hint
      document.getElementById('rating-hint').textContent = RATING_HINTS[current];

      // Bounce
      const btn = document.getElementById('rating-tap-btn');
      btn.style.transform = 'scale(0.87)';
      setTimeout(() => { btn.style.transform = 'scale(1)'; }, 110);

      // Auto-save 2 s after last tap (only if rating > 0)
      clearTimeout(state.timer);
      if (current > 0) {
        state.timer = setTimeout(() => commitRating(state.date, current), 2000);
      }
    }

    async function commitRating(date, rating) {
      try {
        await fetch('/api/rate', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date, rating }),
        });
      } catch (err) {
        console.error('Rating save error (non-fatal):', err);
      }
      proceedAfterRating();
    }

    function handleRatingSkip() {
      const state = window.__ratingState;
      if (state?.timer) clearTimeout(state.timer);
      proceedAfterRating();
    }

    async function proceedAfterRating() {
      ratingPromptHandled = true;
      window.__ratingState = null;
      // Re-load to get today's fresh state
      const date = getTodayDate();
      try {
        const res = await fetch(`/api/load?date=${date}`);
        const data = res.ok ? await res.json() : {};
        renderHeader(date, data.streak ?? 0);
        renderHistory(data.history || []);
        if (data.today) renderCommittedDay(data.today);
        else renderFreshDay();
      } catch {
        renderFreshDay();
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // LOAD
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    let selectedFocus = null;

    async function loadApp() {
      const date = getTodayDate();
      renderHeader(date, null);

      try {
        const res = await fetch(`/api/load?date=${date}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        renderHeader(date, data.streak ?? 0);
        renderHistory(data.history || []);

        // Show rating prompt if yesterday has an unrated entry (once per session)
        if (!ratingPromptHandled) {
          const yesterday = getYesterdayDate();
          const yesterdayEntry = (data.history || []).find(e => e.date === yesterday);
          if (yesterdayEntry && yesterdayEntry.rating == null) {
            renderRatingScreen(yesterdayEntry);
            return;
          }
        }

        if (data.today) {
          renderCommittedDay(data.today);
        } else {
          renderFreshDay();
        }
      } catch (err) {
        console.error('Load error:', err);
        document.getElementById('checkin-section').innerHTML =
          '<div class="error-msg">Could not connect — please refresh.</div>';
        document.getElementById('history-section').innerHTML = '';
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // MILESTONE CELEBRATION
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    const MILESTONE_MESSAGES = {
      10:  "Ten mornings of choosing yourself.",
      20:  "Twenty days. The habit is real.",
      30:  "A full month of showing up.",
      40:  "Forty mornings. Still here.",
      50:  "Halfway to a hundred.",
      60:  "Two months. You're building something.",
      70:  "Seventy days. Keep going.",
      80:  "Eighty mornings. Almost there.",
      90:  "Ninety days. One last push.",
      100: "One hundred days. This is who you are now.",
    };

    function showMilestoneCelebration(streak) {
      // Only once per milestone — stored in localStorage (cosmetic only)
      const key = `milestone-v1-${streak}`;
      if (localStorage.getItem(key)) return;
      localStorage.setItem(key, '1');

      const msg = MILESTONE_MESSAGES[streak] || `${streak} days of showing up.`;

      const overlay = document.createElement('div');
      overlay.className = 'milestone-overlay';
      overlay.innerHTML = `
        <div class="milestone-day-label">Day</div>
        <div class="milestone-number">${streak}</div>
        <div class="milestone-message">${esc(msg)}</div>
        <div class="milestone-dismiss">tap to continue</div>
      `;

      // Floating particles
      const particleColors = [
        'rgba(184,119,58,0.55)',
        'rgba(184,119,58,0.35)',
        'rgba(184,119,58,0.75)',
        'rgba(221,213,198,0.85)',
        'rgba(155,95,30,0.45)',
      ];
      for (let i = 0; i < 16; i++) {
        const p = document.createElement('div');
        p.className = 'ms-particle';
        const size   = 3 + Math.random() * 8;
        const left   = 5  + Math.random() * 90;
        const bottom = 3  + Math.random() * 45;
        const dur    = 2.8 + Math.random() * 2.8;
        const delay  = Math.random() * 2.2;
        const drift  = (Math.random() - 0.5) * 90;
        const color  = particleColors[Math.floor(Math.random() * particleColors.length)];
        p.style.cssText = [
          `width:${size}px`, `height:${size}px`,
          `left:${left}%`, `bottom:${bottom}%`,
          `background:${color}`,
          `--drift:${drift}px`,
          `animation-duration:${dur}s`,
          `animation-delay:${delay}s`,
        ].join(';');
        overlay.appendChild(p);
      }

      const dismiss = () => {
        overlay.classList.add('hiding');
        setTimeout(() => overlay.remove(), 700);
      };

      overlay.addEventListener('click', dismiss);
      setTimeout(dismiss, 5500); // auto-dismiss after 5.5 s

      document.body.appendChild(overlay);
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // SUBMIT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    async function handleCommit() {
      const date       = getTodayDate();
      const focus      = selectedFocus;
      const commitment = (document.getElementById('commitment-input')?.value || '').trim();
      const errorEl    = document.getElementById('error-msg');
      const btn        = document.getElementById('commit-btn');

      if (!focus) {
        errorEl.textContent = 'Please choose a focus for today.';
        errorEl.style.display = 'block';
        return;
      }
      if (!commitment) {
        errorEl.textContent = 'Please add your commitment before submitting.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Committing...';
      errorEl.style.display = 'none';

      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date, focus, commitment }),
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const entry = await res.json();
        renderCommittedDay(entry);

        // Refresh streak + history without full page reload
        const reload = await fetch(`/api/load?date=${date}`);
        if (reload.ok) {
          const fresh = await reload.json();
          const newStreak = fresh.streak ?? 0;
          renderHeader(date, newStreak);
          renderHistory(fresh.history || []);

          // Milestone celebration — every multiple of 10
          if (newStreak > 0 && newStreak % 10 === 0) {
            showMilestoneCelebration(newStreak);
          }
        }
      } catch (err) {
        console.error('Submit error:', err);
        btn.disabled = false;
        btn.textContent = 'Commit to the day';
        errorEl.textContent = 'Something went wrong — please try again.';
        errorEl.style.display = 'block';
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // UTILS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function esc(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // INIT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    document.addEventListener('DOMContentLoaded', loadApp);
  </script>
</body>
</html>
