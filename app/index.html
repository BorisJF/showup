<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOW UP</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #ede8df;
      --text:        #28201a;
      --muted:       #9a8b7b;
      --amber:       #b8773a;
      --amber-light: rgba(184, 119, 58, 0.10);
      --card:        #ffffff;
      --card-border: rgba(40, 32, 26, 0.09);
      --card-shadow: 0 1px 4px rgba(40, 32, 26, 0.08);
      --badge-bg:    #ddd5c6;
      --rule-color:  rgba(184, 119, 58, 0.45);
    }

    html { background: var(--bg); }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      font-size: 16px;
      line-height: 1.55;
      max-width: 500px;
      margin: 0 auto;
      padding: 28px 20px 88px;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    #app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .date-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border-radius: 100px;
      padding: 7px 14px 7px 11px;
      box-shadow: 0 1px 6px rgba(40, 32, 26, 0.13);
    }

    .streak-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
      flex-shrink: 0;
    }

    .streak-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
    }

    .streak-milestone-line {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      color: var(--amber);
      text-align: right;
      margin-top: 5px;
      letter-spacing: 0.08em;
      min-height: 14px;
    }

    /* ── GREETING ── */
    .greeting {
      text-align: center;
      font-size: 18px;
      font-style: italic;
      color: var(--text);
      margin-bottom: 26px;
      text-wrap: balance;
    }

    /* ── REMEMBER THIS ── */
    .remember-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .remember-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 14px;
    }

    .remember-line1 {
      font-size: 29px;
      font-weight: 400;
      line-height: 1.25;
      color: var(--text);
      text-wrap: balance;
    }

    .remember-line2 {
      font-size: 31px;
      font-weight: 500;
      font-style: italic;
      line-height: 1.25;
      color: var(--amber);
      text-wrap: balance;
    }

    .remember-rule {
      width: 38px;
      height: 2px;
      background: var(--rule-color);
      margin: 18px auto 0;
      border-radius: 1px;
    }

    /* ── SECTION HEADER + LINE ── */
    .section-header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: rgba(40, 32, 26, 0.12);
    }

    /* ── FOCUS CARDS ── */
    .focus-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      margin-bottom: 10px;
      transition: border-color 0.14s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .focus-card.selected {
      border-color: var(--amber);
    }

    .letter-badge {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 10px;
      background: var(--badge-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 600;
      font-style: normal;
      color: var(--text);
      font-family: 'Lora', Georgia, serif;
    }

    .card-name {
      flex: 1;
      font-size: 16px;
      font-weight: 400;
      font-style: normal;
      color: var(--text);
      text-wrap: pretty;
    }

    .radio-circle {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 2px solid rgba(40, 32, 26, 0.20);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.14s, background 0.14s;
    }

    .focus-card.selected .radio-circle {
      border-color: var(--amber);
      background: var(--amber);
    }

    .focus-card.selected .radio-circle::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
    }

    /* ── COMMITMENT TEXTAREA ── */
    .commitment-group {
      margin-top: 26px;
    }

    .field-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      display: block;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      color: var(--text);
      font-family: 'Lora', Georgia, serif;
      font-size: 16px;
      padding: 14px 16px;
      outline: none;
      resize: none;
      min-height: 88px;
      line-height: 1.55;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.14s;
    }

    textarea:focus {
      border-color: rgba(40, 32, 26, 0.28);
    }

    textarea::placeholder {
      color: rgba(40, 32, 26, 0.22);
      font-style: italic;
    }

    /* ── COMMIT BUTTON ── */
    .commit-btn {
      width: 100%;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: 17px;
      cursor: pointer;
      margin-top: 14px;
      transition: opacity 0.12s;
    }

    .commit-btn:hover  { opacity: 0.88; }
    .commit-btn:active { opacity: 0.72; }
    .commit-btn:disabled { opacity: 0.32; cursor: not-allowed; }

    /* ── CHANGE PILL ── */
    .change-btn {
      display: block;
      margin: 12px auto 0;
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      padding: 7px 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--muted);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.14s, color 0.14s;
    }
    .change-btn:hover  { border-color: rgba(40, 32, 26, 0.18); color: var(--text); }
    .change-btn:active { opacity: 0.7; }

    /* ── ACT LABEL ACCENT ── */
    .act-letter {
      color: var(--amber);
      font-weight: 600;
    }

    .error-msg {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px;
      color: #b03030;
      margin-top: 10px;
    }

    /* ── LOCKED ENTRY ── */
    .locked-field {
      margin-bottom: 20px;
    }

    .locked-value {
      font-size: 17px;
      line-height: 1.55;
      color: var(--text);
      text-wrap: pretty;
    }

    /* ── DAILY MESSAGE ── */
    .message-card {
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      box-shadow: var(--card-shadow);
      padding: 20px;
      margin-top: 22px;
    }

    .message-mode {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 10px;
    }

    .message-text {
      font-size: 17px;
      font-style: italic;
      line-height: 1.62;
      color: var(--text);
      text-wrap: pretty;
    }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: rgba(40, 32, 26, 0.10);
      margin: 38px 0;
    }

    /* ── RECENT MORNINGS ── */
    .morning-entry {
      padding: 14px 0;
      border-bottom: 1px solid rgba(40, 32, 26, 0.08);
    }

    .morning-entry:last-child { border-bottom: none; }

    .morning-date {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .morning-focus {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .morning-commitment {
      font-size: 14px;
      color: var(--muted);
      font-style: italic;
      line-height: 1.4;
      text-wrap: pretty;
    }

    .empty-state {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 14px;
      color: var(--muted);
    }

    /* ── MORNING RATING DOTS (history) ── */
    .morning-rating {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      align-items: center;
    }

    .morning-rating-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(40, 32, 26, 0.12);
    }

    .morning-rating-dot.filled {
      background: var(--amber);
    }

    /* ── RATING SCREEN ── */
    .rating-context {
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 32px;
    }

    .rating-context-date {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 8px;
    }

    .rating-context-focus {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .rating-context-commitment {
      font-size: 14px;
      color: var(--muted);
      font-style: italic;
      line-height: 1.4;
      text-wrap: pretty;
    }

    .rating-btn-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .rating-tap-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      background: var(--badge-bg);
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: transform 0.1s ease;
    }

    .rating-ring-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: rotate(-90deg);
      pointer-events: none;
    }

    .rating-ring-bg {
      fill: none;
      stroke: rgba(40, 32, 26, 0.08);
      stroke-width: 6;
    }

    .rating-ring-fill {
      fill: none;
      stroke: var(--amber);
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.25s ease, stroke 0.25s ease;
    }

    .rating-number {
      font-family: 'Lora', Georgia, serif;
      font-size: 68px;
      font-weight: 500;
      color: var(--text);
      position: relative;
      z-index: 1;
      transition: color 0.2s;
      pointer-events: none;
    }

    .rating-hint {
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
      min-height: 20px;
      margin-bottom: 22px;
      transition: opacity 0.2s;
    }

    .rating-skip {
      display: block;
      margin: 0 auto;
      background: none;
      border: none;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      cursor: pointer;
      padding: 8px 12px;
      opacity: 0.65;
      letter-spacing: 0.04em;
    }

    .rating-skip:hover { opacity: 1; }

    /* ── MILESTONE CELEBRATION ── */
    .milestone-overlay {
      position: fixed;
      inset: 0;
      background: rgba(237, 232, 223, 0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      overflow: hidden;
      animation: ms-fade-in 0.5s ease forwards;
    }

    .milestone-overlay.hiding {
      animation: ms-fade-out 0.7s ease forwards;
      pointer-events: none;
    }

    @keyframes ms-fade-in  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes ms-fade-out { from { opacity: 1; } to { opacity: 0; } }

    .milestone-day-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--amber);
      animation: ms-rise 0.7s 0.1s ease both;
    }

    .milestone-number {
      font-family: 'Lora', Georgia, serif;
      font-size: 108px;
      font-weight: 600;
      color: var(--text);
      line-height: 1;
      animation: ms-pop 0.65s 0.15s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .milestone-message {
      font-family: 'Lora', Georgia, serif;
      font-size: 20px;
      font-style: italic;
      color: var(--text);
      text-align: center;
      max-width: 290px;
      line-height: 1.45;
      margin-top: 18px;
      animation: ms-rise 0.7s 0.35s ease both;
    }

    .milestone-dismiss {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-top: 52px;
      animation: ms-rise 0.7s 0.65s ease both;
    }

    @keyframes ms-pop {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    @keyframes ms-rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    .ms-particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: ms-particle-float linear forwards;
    }

    @keyframes ms-particle-float {
      0%   { opacity: 0.75; transform: translateY(0)     translateX(0)            scale(1);   }
      100% { opacity: 0;    transform: translateY(-300px) translateX(var(--drift)) scale(0.2); }
    }

    /* ── THE BLOOM (submit celebration) ── */
    .bloom-overlay {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 500;
      background: radial-gradient(
        circle at 50% 50%,
        rgba(184, 119, 58, 0.90) 0%,
        rgba(196, 138, 65, 0.75) 42%,
        rgba(218, 172, 100, 0.48) 100%
      );
      clip-path: circle(0% at 50% 50%);
      animation: bloom-open 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    .bloom-overlay.closing {
      clip-path: circle(150% at 50% 50%);
      animation: bloom-close 0.55s cubic-bezier(0.4, 0, 0.8, 0.2) forwards;
    }
    @keyframes bloom-open {
      from { clip-path: circle(0% at 50% 50%); }
      to   { clip-path: circle(150% at 50% 50%); }
    }
    @keyframes bloom-close {
      from { clip-path: circle(150% at 50% 50%); }
      to   { clip-path: circle(0% at 50% 50%); }
    }

    /* ── SPLASH SCREEN ── */
    #splash {
      position: fixed; inset: 0;
      background: #fdf9f5;
      display: flex;
      align-items: center; justify-content: center;
      z-index: 3000;
      transition: opacity 0.75s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #splash.hidden { opacity: 0; pointer-events: none; }

    #sp-logo {
      width: min(62vw, 240px);
      height: auto;
      animation: spLogoIn 1.0s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes spLogoIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

    /* ── RATING 5-STAR CONFETTI ── */
    .rc-particle {
      position: fixed; border-radius: 50%;
      pointer-events: none; z-index: 600;
      animation: rc-burst ease-out forwards;
    }
    @keyframes rc-burst {
      0%   { opacity: 1;  transform: translate(0, 0) scale(1); }
      100% { opacity: 0;  transform: translate(var(--tx), var(--ty)) scale(0.1); }
    }

    /* ── RESET BUTTON ── */
    .reset-btn {
      display: block; margin: 36px auto 0;
      background: none; border: none;
      color: rgba(154, 139, 123, 0.36);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px; letter-spacing: 0.08em;
      cursor: pointer; padding: 8px 16px;
      transition: color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .reset-btn:hover   { color: rgba(154, 139, 123, 0.65); }
    .reset-btn.confirming { color: var(--amber); }

    /* ── COMMITMENT QUALITY HINT ── */
    .quality-hint {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      min-height: 16px; margin-top: 7px;
      opacity: 0; transition: opacity 0.4s;
    }
    .quality-hint.visible   { opacity: 1; }
    .quality-vague          { color: var(--muted); }
    .quality-specific       { color: var(--amber); }
    .quality-exceptional    { color: var(--amber); font-weight: 700; letter-spacing: 0.22em; }

    /* ── OFFLINE BANNER ── */
    .offline-saved { text-align: center; padding: 28px 0 8px; }
    .offline-saved-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--amber); margin-bottom: 12px;
    }
    .offline-saved-msg {
      font-size: 16px; font-style: italic; color: var(--muted); line-height: 1.55;
    }

    /* ── LOADING ── */
    .loading {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px;
      color: var(--muted);
    }

    /* ── SIMULATE (testing only) ── */
    .test-area {
      margin-top: 52px;
      text-align: center;
    }

    .simulate-btn {
      background: transparent;
      border: 1px solid rgba(40, 32, 26, 0.15);
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }

    .simulate-btn:hover {
      color: var(--text);
      border-color: rgba(40, 32, 26, 0.3);
    }

    .simulate-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ── WEATHER SUBLINE ────────────────────────────── */
    .weather-subline {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-top: -18px;
      margin-bottom: 22px;
      min-height: 16px;
      line-height: 1.5;
    }

    .weather-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
      opacity: 0.65;
    }
    .weather-btn:hover { opacity: 1; }

    /* ── WORD CLOUD ─────────────────────────────────── */
    .wordcloud-container {
      margin-top: 44px;
    }

    .wordcloud-bg {
      border-radius: 16px;
      padding: 28px 18px 24px;
      background: linear-gradient(160deg, #fbf9f4 0%, #f4efe4 100%);
      min-height: 180px;
      display: flex;
      flex-wrap: wrap;
      gap: 9px 13px;
      justify-content: center;
      align-items: center;
    }

    .cloud-word {
      font-family: Georgia, 'Times New Roman', serif;
      cursor: default;
      line-height: 1.2;
      display: inline-block;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cloud-word:hover { transform: scale(1.12); }

    .cloud-empty {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 15px;
      color: #9c7a52;
      text-align: center;
      padding: 20px 8px;
      line-height: 1.8;
      width: 100%;
    }

    /* ── MILESTONE IMAGE MODAL ──────────────────────── */
    .ms-img-modal {
      position: fixed;
      inset: 0;
      z-index: 4000;
      background: rgba(40, 32, 26, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      animation: msiFadeIn 0.28s ease forwards;
    }

    @keyframes msiFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .ms-img-modal.hiding {
      animation: msiFadeOut 0.28s ease forwards;
    }

    @keyframes msiFadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    .ms-img-card {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      max-width: 360px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 24px 64px rgba(40, 32, 26, 0.32);
    }

    .ms-img-canvas {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .ms-img-actions {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .ms-img-download {
      flex: 1;
      background: #4a3826;
      color: #fbf9f4;
      border: none;
      border-radius: 100px;
      padding: 13px 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.03em;
    }

    .ms-img-close {
      background: transparent;
      border: 1.5px solid rgba(40, 32, 26, 0.18);
      color: var(--muted);
      border-radius: 100px;
      padding: 13px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px;
      cursor: pointer;
    }

    /* ── SPECIAL CHALLENGE ──────────────────────────── */
    .sp-overlay {
      position: fixed; inset: 0; z-index: 5000;
      background: rgba(74, 56, 38, 0.65);
      display: flex; align-items: center; justify-content: center;
      padding: 24px 20px;
      animation: spOverIn 0.35s ease forwards;
    }
    @keyframes spOverIn  { from { opacity: 0; } to { opacity: 1; } }
    .sp-overlay.hiding   { animation: spOverOut 0.28s ease forwards; }
    @keyframes spOverOut { from { opacity: 1; } to { opacity: 0; } }

    .sp-card {
      background: #fbf9f4; border: 1px solid #ddd2bd; border-radius: 22px;
      padding: 36px 28px; max-width: 380px; width: 100%;
      box-shadow: 0 12px 50px rgba(100,80,50,.18); text-align: center;
    }

    .sp-phase { display: none; }
    .sp-phase.on { display: block; animation: spPhaseIn .35s ease; }
    @keyframes spPhaseIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    .sp-eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      color: #9c8a6f; margin-bottom: 18px;
    }
    .sp-heading { font-size: 22px; line-height: 1.35; color: #4a3826; margin-bottom: 10px; }
    .sp-sub { font-size: 14px; color: #9c8a6f; font-style: italic; margin-bottom: 32px; }

    .sp-big-btn {
      width: 100%; padding: 22px 16px; background: #6b4f3a; color: #fbf9f4;
      border: none; border-radius: 14px; font-family: Georgia, serif;
      font-size: 17px; line-height: 1.4; cursor: pointer;
      box-shadow: 0 6px 24px rgba(100,70,30,.22);
      transition: background .18s, transform .18s, box-shadow .18s;
    }
    .sp-big-btn:hover {
      background: #4a3826; transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(100,70,30,.3);
    }
    .sp-big-btn:active { transform: translateY(1px); }

    .sp-skip {
      display: block; margin-top: 16px; font-size: 13px; color: #9c8a6f;
      cursor: pointer; font-style: italic; background: none; border: none;
      font-family: Georgia, serif; width: 100%;
    }
    .sp-skip:hover { color: #4a3826; }

    .sp-tap-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
      color: #9c8a6f; margin-bottom: 10px;
    }
    .sp-tap-count {
      display: block; font-size: 88px; font-weight: 700; color: #6b4f3a;
      line-height: 1; margin-bottom: 28px;
      transition: transform .08s, color .08s;
    }
    .sp-tap-count.sp-pop { transform: scale(1.2); color: #8a6d4a; }

    .sp-tap-btn {
      width: 100%; padding: 26px 16px; background: #6b4f3a; color: #fbf9f4;
      border: none; border-radius: 16px; font-family: Georgia, serif;
      font-size: 18px; line-height: 1.4; cursor: pointer; user-select: none;
      box-shadow: 0 6px 24px rgba(100,70,30,.24);
      transition: transform .07s, box-shadow .07s;
      -webkit-tap-highlight-color: transparent;
    }
    .sp-tap-btn:active { transform: scale(.96); box-shadow: 0 2px 10px rgba(100,70,30,.18); }

    .sp-result-score {
      display: block; font-size: 100px; font-weight: 700; color: #6b4f3a;
      line-height: 1; margin: 0 0 4px;
    }
    .sp-result-unit {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
      color: #9c8a6f; margin-bottom: 28px;
    }
    .sp-result-msg { font-size: 20px; line-height: 1.5; color: #4a3826; margin-bottom: 32px; }
    .sp-result-msg strong { color: #8a6d4a; font-weight: 700; font-style: normal; }

    .sp-done-btn {
      padding: 14px 32px; background: transparent;
      border: 1.5px solid #8a6d4a; border-radius: 100px;
      font-family: Georgia, serif; font-size: 14px; color: #8a6d4a;
      cursor: pointer; transition: .2s;
    }
    .sp-done-btn:hover { background: #8a6d4a; color: #fbf9f4; }

    .sp-confetti-wrap {
      position: fixed; inset: 0; pointer-events: none;
      overflow: hidden; z-index: 6000;
    }
    .sp-dot {
      position: absolute; border-radius: 2px; opacity: 0;
      animation: spDotFall 1.6s ease-in forwards;
    }
    @keyframes spDotFall {
      0%   { opacity: 1; transform: translateY(-10px) rotate(0deg) scale(1); }
      100% { opacity: 0; transform: translateY(100vh) rotate(900deg) scale(.4); }
    }

    /* ── SHARE MILESTONE BUTTON ─────────────────────── */
    .share-milestone-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.06em;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
      opacity: 0.65;
      display: block;
      text-align: right;
      margin-top: 5px;
    }

    .share-milestone-btn:hover { opacity: 1; }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash">
    <img id="sp-logo" src="/logo.png" alt="">
  </div>

  <!-- HEADER: date + streak pill -->
  <div id="app-header">
    <div class="date-label" id="date-display">—</div>
    <div>
      <div class="streak-pill">
        <div class="streak-dot"></div>
        <span class="streak-pill-text" id="streak-pill-text">0 -day streak</span>
      </div>
      <div class="streak-milestone-line" id="streak-milestone"></div>
      <button class="share-milestone-btn" id="share-milestone-btn" style="display:none"
        onclick="showMilestoneImageModal()">Share milestone →</button>
    </div>
  </div>

  <!-- GREETING -->
  <div class="greeting" id="greeting">Good morning, Boris.</div>

  <!-- WEATHER SUBLINE -->
  <div class="weather-subline" id="weather-subline"></div>

  <!-- REMEMBER THIS -->
  <div class="remember-section">
    <div class="remember-label">Remember this</div>
    <div class="remember-line1" id="remember-line1"></div>
    <div class="remember-line2" id="remember-line2"></div>
    <div class="remember-rule"></div>
  </div>

  <!-- TODAY'S CHECK-IN (fresh or committed state) -->
  <div id="checkin-section">
    <div class="loading">Loading...</div>
  </div>

  <!-- RECENT MORNINGS -->
  <div class="section-header-row" style="margin-top: 48px;">
    <span class="section-label">Recent mornings</span>
    <div class="section-line"></div>
  </div>
  <div id="history-section">
    <div class="loading">...</div>
  </div>

  <!-- WORD CLOUD -->
  <div class="wordcloud-container" id="wordcloud-section" style="display:none">
    <div class="section-header-row">
      <span class="section-label">Your words</span>
      <div class="section-line"></div>
    </div>
    <div class="wordcloud-bg" id="wordcloud-bg">
      <div class="cloud-empty">Loading…</div>
    </div>
  </div>


  <script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // CONTENT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    const PRINCIPLES = [
      { letter: 'S', name: 'Smile and be nice',              act: "When I pass someone, I'll smile first" },
      { letter: 'H', name: 'Hold their gaze',                act: "When we talk, I'll really look at them" },
      { letter: 'O', name: 'Own it, you can fix it',         act: "When I slip, I'll own it out loud" },
      { letter: 'W', name: "Watch who you're around",        act: "Today I'll lean toward the people who lift me by…" },
      { letter: 'U', name: 'You, too, deserve kindness',     act: "Today I'll be kind to myself by…" },
      { letter: 'P', name: 'Present is where you need to be', act: "When I catch myself drifting, I'll…" },
    ];

    // Daily affirmations for "Remember this" — rotate by date
    const AFFIRMATIONS = [
      { line1: 'You have a superpower:',            line2: 'making people feel special.' },
      { line1: 'Your instincts have earned their keep:', line2: 'trust them today.' },
      { line1: 'The room changes when you walk in:', line2: 'show up fully.' },
      { line1: "You've been through harder things:", line2: 'you already know how.' },
      { line1: 'The work you do quietly',            line2: 'matters more than you think.' },
      { line1: 'Your presence is a gift —',          line2: "don't forget to give it." },
      { line1: "You don't need all the answers.",    line2: 'You need the next step.' },
    ];

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // DATE UTILS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function getTodayDate() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getYesterdayDate() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('en-US', {
        weekday: 'long', month: 'long', day: 'numeric'
      }).toUpperCase();
    }

    function getGreeting() {
      const h = new Date().getHours();
      if (h >= 4 && h < 12) return 'Good morning, Boris.';
      if (h >= 12 && h < 18) return 'Good afternoon, Boris.';
      return 'Good evening, Boris.';
    }

    function getDailyAffirmation(dateStr) {
      const seed = dateStr.replace(/-/g, '').split('').reduce((a, c) => a + c.charCodeAt(0), 0);
      return AFFIRMATIONS[seed % AFFIRMATIONS.length];
    }

    function getMilestone(streak) {
      if (streak >= 100) return '✦  100-day mark';
      if (streak >= 30)  return '◆  30-day mark';
      if (streak >= 7)   return '◇  7-day mark';
      return '';
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // RENDER
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function renderHeader(date, streak) {
      document.getElementById('date-display').textContent = formatDate(date);
      document.getElementById('greeting').textContent = getGreeting();

      // Affirmation
      const aff = getDailyAffirmation(date);
      document.getElementById('remember-line1').textContent = aff.line1;
      document.getElementById('remember-line2').textContent = aff.line2;

      // Streak
      const s = (streak !== null && streak !== undefined) ? streak : 0;
      document.getElementById('streak-pill-text').textContent = `${s} -day streak`;
      document.getElementById('streak-milestone').textContent = getMilestone(s);

      // Share milestone button — visible once streak ≥ 7
      _currentStreak = s;
      const shareBtn = document.getElementById('share-milestone-btn');
      if (shareBtn) shareBtn.style.display = s >= 7 ? '' : 'none';

      // Weather (only init once per session)
      if (!_weatherInited) { _weatherInited = true; initWeather(); }
    }

    function renderFreshDay() {
      selectedFocus = null;

      const cards = PRINCIPLES.map((p, i) => `
        <div class="focus-card" data-idx="${i}" onclick="selectCard(this)">
          <div class="letter-badge">${p.letter}</div>
          <div class="card-name">${esc(p.name)}</div>
          <div class="radio-circle"></div>
        </div>
      `).join('');

      document.getElementById('checkin-section').innerHTML = `
        <div id="focus-step">
          <div class="section-header-row">
            <span class="section-label">Show up one way today</span>
            <div class="section-line"></div>
          </div>
          ${cards}
        </div>
        <div id="act-step"></div>
      `;
    }

    function selectCard(card) {
      const p = PRINCIPLES[+card.dataset.idx];
      selectedFocus = p.name;

      document.getElementById('focus-step').innerHTML = `
        <div class="section-header-row">
          <span class="section-label">Today you're showing up</span>
          <div class="section-line"></div>
        </div>
        <div class="focus-card selected" style="cursor:default">
          <div class="letter-badge">${p.letter}</div>
          <div class="card-name">${esc(p.name)}</div>
          <div class="radio-circle"></div>
        </div>
        <button class="change-btn" onclick="renderFreshDay()">or change</button>
      `;

      document.getElementById('act-step').innerHTML = `
        <div class="commitment-group">
          <label class="field-label" for="commitment-input">
            <span class="act-letter">A</span>&nbsp;Act today
          </label>
          <textarea
            id="commitment-input"
            placeholder="${esc(p.act)}"
            oninput="handleCommitmentInput()"
            rows="3"
          ></textarea>
          <div class="quality-hint" id="quality-hint"></div>
        </div>

        <button class="commit-btn" id="commit-btn" onclick="handleCommit()">
          Show Up!
        </button>
        <div class="error-msg" id="error-msg" style="display:none"></div>
      `;

      const ta = document.getElementById('commitment-input');
      if (ta) ta.focus();
    }

    function renderCommittedDay(entry) {
      const mode = entry.message_mode
        ? entry.message_mode.charAt(0).toUpperCase() + entry.message_mode.slice(1)
        : 'Message';

      document.getElementById('checkin-section').innerHTML = `
        <div class="section-header-row">
          <span class="section-label">Today's focus</span>
          <div class="section-line"></div>
        </div>
        <div class="locked-field">
          <div class="locked-value">${esc(entry.focus)}</div>
        </div>

        <div class="section-header-row" style="margin-top:20px">
          <span class="section-label">Today's act</span>
          <div class="section-line"></div>
        </div>
        <div class="locked-field">
          <div class="locked-value">${esc(entry.commitment)}</div>
        </div>

        ${entry.daily_message ? `
          <div class="message-card">
            <div class="message-mode">${esc(mode)}</div>
            <div class="message-text">${esc(entry.daily_message)}</div>
          </div>
        ` : ''}

        <button class="reset-btn" id="reset-btn"
          data-date="${esc(entry.date)}"
          data-yesterday="${getYesterdayDate()}"
          onclick="handleReset(this.dataset.date, this.dataset.yesterday)">
          Reset today
        </button>
      `;
    }

    function renderHistory(history) {
      const el = document.getElementById('history-section');
      if (!history || history.length === 0) {
        el.innerHTML = '<div class="empty-state">Your committed mornings will gather here.</div>';
        return;
      }
      el.innerHTML = history.map(e => {
        const ratingDots = (e.rating !== null && e.rating !== undefined)
          ? `<div class="morning-rating">${[1,2,3,4,5].map(i =>
              `<div class="morning-rating-dot${i <= e.rating ? ' filled' : ''}"></div>`
            ).join('')}</div>`
          : '';
        return `
          <div class="morning-entry">
            <div class="morning-date">${formatDate(e.date)}</div>
            <div class="morning-focus">${esc(e.focus)}</div>
            <div class="morning-commitment">${esc(e.commitment)}</div>
            ${ratingDots}
          </div>
        `;
      }).join('');
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // SELF-RATING
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    // Set to true once the rating prompt has been handled this session
    // (prevents the prompt re-appearing if loadApp is called again, e.g. after submit)
    let ratingPromptHandled = false;

    const RATING_CIRCUMFERENCE = 2 * Math.PI * 100; // radius 100 inside 220px button

    const RATING_HINTS = [
      'Hold to rate',
      "I barely tried…",
      'Made some effort',
      'Good showing',
      'Showed up well',
      'Like a rock star! ⭐'
    ];

    const RATING_COLORS = [
      'rgba(184,119,58,0)',
      'rgba(184,119,58,0.30)',
      'rgba(184,119,58,0.50)',
      'rgba(184,119,58,0.70)',
      'rgba(184,119,58,0.88)',
      'rgba(184,119,58,1.00)',
    ];

    function renderRatingScreen(yesterday) {
      document.getElementById('checkin-section').innerHTML = `
        <div class="section-header-row">
          <span class="section-label">How did yesterday go?</span>
          <div class="section-line"></div>
        </div>

        <div class="rating-context">
          <div class="rating-context-date">${formatDate(yesterday.date)}</div>
          <div class="rating-context-focus">${esc(yesterday.focus)}</div>
          <div class="rating-context-commitment">${esc(yesterday.commitment)}</div>
        </div>

        <div class="rating-btn-wrap">
          <button class="rating-tap-btn" id="rating-tap-btn"
            onmousedown="handleRatingHoldStart(event)"
            ontouchstart="handleRatingHoldStart(event)"
            onmouseup="handleRatingHoldEnd(event)"
            ontouchend="handleRatingHoldEnd(event)"
            onmouseleave="handleRatingHoldEnd(event)">
            <svg class="rating-ring-svg" viewBox="0 0 220 220">
              <circle class="rating-ring-bg" cx="110" cy="110" r="100"/>
              <circle class="rating-ring-fill" id="rating-ring" cx="110" cy="110" r="100"
                stroke-dasharray="${RATING_CIRCUMFERENCE.toFixed(2)}"
                stroke-dashoffset="${RATING_CIRCUMFERENCE.toFixed(2)}"/>
            </svg>
            <span class="rating-number" id="rating-number">0</span>
          </button>
        </div>

        <div class="rating-hint" id="rating-hint">Tap to rate</div>

        <button class="rating-skip" onclick="handleRatingSkip()">skip →</button>
      `;

      // State lives on a plain object (not window) to avoid leaks
      window.__ratingState = { date: yesterday.date, current: 0, timer: null };
    }

    // ── Press-and-hold rating ─────────────────────────────────────────────
    const HOLD_DURATION = 3000; // ms to go from 0 → 5
    let _holdStart = null;
    let _holdRaf   = null;

    function handleRatingHoldStart(e) {
      e.preventDefault();
      getAudioCtx(); // unlock audio context during user gesture — must happen here
      if (_holdStart !== null) return; // already holding
      _holdStart = Date.now();
      _lastTick = 0; // reset tick tracker

      const tick = () => {
        if (_holdStart === null) return;
        const elapsed  = Date.now() - _holdStart;
        const progress = Math.min(elapsed / HOLD_DURATION, 1);
        const rating   = Math.min(5, Math.ceil(progress * 5));

        // Smooth ring fill
        const ring = document.getElementById('rating-ring');
        if (ring) {
          ring.style.strokeDashoffset = RATING_CIRCUMFERENCE * (1 - progress);
          ring.style.stroke = RATING_COLORS[rating] || RATING_COLORS[5];
        }
        const numEl  = document.getElementById('rating-number');
        const hintEl = document.getElementById('rating-hint');
        if (numEl)  numEl.textContent  = rating;
        if (hintEl) hintEl.textContent = RATING_HINTS[rating] || '';

        // Play tick for each new step (steps 1-4; step 5 gets the arpeggio)
        playSoundRatingTick(rating);

        if (progress < 1) {
          _holdRaf = requestAnimationFrame(tick);
        } else {
          // Reached 5 — auto-complete
          _holdStart = null;
          triggerRatingConfetti();
          const state = window.__ratingState;
          if (state) commitRating(state.date, 5);
        }
      };
      _holdRaf = requestAnimationFrame(tick);
    }

    function handleRatingHoldEnd(e) {
      if (_holdStart === null) return;
      const elapsed = Date.now() - _holdStart;
      cancelAnimationFrame(_holdRaf);
      _holdRaf   = null;
      _holdStart = null;

      const progress = Math.min(elapsed / HOLD_DURATION, 1);
      const rating   = Math.min(5, Math.ceil(progress * 5));

      if (elapsed < 120 || rating === 0) return; // accidental touch

      if (rating === 5) triggerRatingConfetti();
      const state = window.__ratingState;
      if (state) commitRating(state.date, rating);
    }

    async function commitRating(date, rating) {
      try {
        await fetch('/api/rate', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date, rating }),
        });
      } catch (err) {
        console.error('Rating save error (non-fatal):', err);
      }
      proceedAfterRating();
    }

    function handleRatingSkip() {
      const state = window.__ratingState;
      if (state?.timer) clearTimeout(state.timer);
      proceedAfterRating();
    }

    async function proceedAfterRating() {
      ratingPromptHandled = true;
      window.__ratingState = null;
      // Re-load to get today's fresh state
      const date = getTodayDate();
      try {
        const res = await fetch(`/api/load?date=${date}`);
        const data = res.ok ? await res.json() : {};
        renderHeader(date, data.streak ?? 0);
        renderHistory(data.history || []);
        if (data.today) renderCommittedDay(data.today);
        else renderFreshDay();
      } catch {
        renderFreshDay();
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // LOAD
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    let selectedFocus = null;

    function hideSplash() {
      const splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(() => splash.remove(), 700);
    }

    async function loadApp() {
      const date = getTodayDate();

      // ── Sync pending offline draft ───────────────────────────────────────
      const pendingDraft = localStorage.getItem('showup-draft');
      if (pendingDraft && navigator.onLine) {
        try {
          const { date: dd, focus: df, commitment: dc } = JSON.parse(pendingDraft);
          localStorage.removeItem('showup-draft');
          await fetch('/api/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date: dd, focus: df, commitment: dc }),
          });
        } catch {}
      }

      try {
        // Wait for both data AND minimum splash display time
        const [data] = await Promise.all([
          fetch(`/api/load?date=${date}`).then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          }),
          new Promise(resolve => setTimeout(resolve, 1600)),
        ]);

        hideSplash();
        renderHeader(date, data.streak ?? 0);
        renderHistory(data.history || []);
        loadWordCloud(data.totalCount ?? 0);

        // Show rating prompt if yesterday has an unrated entry (once per session)
        if (!ratingPromptHandled) {
          const yesterday = getYesterdayDate();
          const yesterdayEntry = (data.history || []).find(e => e.date === yesterday);
          if (yesterdayEntry && yesterdayEntry.rating == null) {
            renderRatingScreen(yesterdayEntry);
            return;
          }
        }

        if (data.today) {
          renderCommittedDay(data.today);
        } else {
          renderFreshDay();
        }
      } catch (err) {
        console.error('Load error:', err);
        hideSplash();
        document.getElementById('checkin-section').innerHTML =
          '<div class="error-msg">Could not connect — please refresh.</div>';
        document.getElementById('history-section').innerHTML = '';
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // MILESTONE CELEBRATION
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    const MILESTONE_MESSAGES = {
      10:  "Ten mornings of choosing yourself.",
      20:  "Twenty days. The habit is real.",
      30:  "A full month of showing up.",
      40:  "Forty mornings. Still here.",
      50:  "Halfway to a hundred.",
      60:  "Two months. You're building something.",
      70:  "Seventy days. Keep going.",
      80:  "Eighty mornings. Almost there.",
      90:  "Ninety days. One last push.",
      100: "One hundred days. This is who you are now.",
    };

    function showMilestoneCelebration(streak) {
      playSoundMilestone();
      // Only once per milestone — stored in localStorage (cosmetic only)
      const key = `milestone-v1-${streak}`;
      if (localStorage.getItem(key)) return;
      localStorage.setItem(key, '1');

      const msg = MILESTONE_MESSAGES[streak] || `${streak} days of showing up.`;

      const overlay = document.createElement('div');
      overlay.className = 'milestone-overlay';
      overlay.innerHTML = `
        <div class="milestone-day-label">Day</div>
        <div class="milestone-number">${streak}</div>
        <div class="milestone-message">${esc(msg)}</div>
        <div class="milestone-dismiss">tap to continue</div>
      `;

      // Floating particles
      const particleColors = [
        'rgba(184,119,58,0.55)',
        'rgba(184,119,58,0.35)',
        'rgba(184,119,58,0.75)',
        'rgba(221,213,198,0.85)',
        'rgba(155,95,30,0.45)',
      ];
      for (let i = 0; i < 16; i++) {
        const p = document.createElement('div');
        p.className = 'ms-particle';
        const size   = 3 + Math.random() * 8;
        const left   = 5  + Math.random() * 90;
        const bottom = 3  + Math.random() * 45;
        const dur    = 2.8 + Math.random() * 2.8;
        const delay  = Math.random() * 2.2;
        const drift  = (Math.random() - 0.5) * 90;
        const color  = particleColors[Math.floor(Math.random() * particleColors.length)];
        p.style.cssText = [
          `width:${size}px`, `height:${size}px`,
          `left:${left}%`, `bottom:${bottom}%`,
          `background:${color}`,
          `--drift:${drift}px`,
          `animation-duration:${dur}s`,
          `animation-delay:${delay}s`,
        ].join(';');
        overlay.appendChild(p);
      }

      const dismiss = () => {
        overlay.classList.add('hiding');
        setTimeout(() => overlay.remove(), 700);
      };

      overlay.addEventListener('click', dismiss);
      setTimeout(dismiss, 5500); // auto-dismiss after 5.5 s

      document.body.appendChild(overlay);
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // SUBMIT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    async function handleCommit() {
      const date       = getTodayDate();
      const focus      = selectedFocus;
      const commitment = (document.getElementById('commitment-input')?.value || '').trim();
      const errorEl    = document.getElementById('error-msg');
      const btn        = document.getElementById('commit-btn');

      if (!focus) {
        errorEl.textContent = 'Please choose a focus for today.';
        errorEl.style.display = 'block';
        return;
      }
      if (!commitment) {
        errorEl.textContent = 'Add how you’ll act on it today before showing up.';
        errorEl.style.display = 'block';
        return;
      }

      // ── Offline draft ──────────────────────────────────────────────────────
      if (!navigator.onLine) {
        localStorage.setItem('showup-draft', JSON.stringify({ date, focus, commitment }));
        document.getElementById('checkin-section').innerHTML = `
          <div class="offline-saved">
            <div class="offline-saved-label">Saved offline</div>
            <div class="offline-saved-msg">Your commitment is saved.<br>It'll submit when you reconnect.</div>
          </div>`;
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Showing up…';
      errorEl.style.display = 'none';

      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date, focus, commitment }),
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const entry = await res.json();

        // ── Submit celebration → then show committed view ──────────────────
        triggerSubmitCelebration(() => {
          renderCommittedDay(entry);
          fetch(`/api/load?date=${date}`)
            .then(r => r.ok ? r.json() : {})
            .then(fresh => {
              const newStreak = fresh.streak ?? 0;
              renderHeader(date, newStreak);
              renderHistory(fresh.history || []);
              if (newStreak > 0 && newStreak % 10 === 0) showMilestoneCelebration(newStreak);
              if ([7, 30, 100].includes(newStreak)) {
                const imgKey = `milestone-img-v1-${newStreak}`;
                if (!localStorage.getItem(imgKey)) {
                  localStorage.setItem(imgKey, '1');
                  setTimeout(() => showMilestoneImageModal(newStreak), newStreak % 10 === 0 ? 1200 : 400);
                }
              }
              // "I am special" challenge — ~25%, once per day, after all else settles
              if (shouldShowChallenge()) {
                setTimeout(showSpecialChallenge, 900);
              }
            })
            .catch(() => {});
        });

      } catch (err) {
        console.error('Submit error:', err);
        btn.disabled = false;
        btn.textContent = 'Show Up!';
        errorEl.textContent = 'Something went wrong — please try again.';
        errorEl.style.display = 'block';
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // THE BLOOM (submit celebration)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function triggerSubmitCelebration(onComplete) {
      if (navigator.vibrate) navigator.vibrate([28, 14, 28]);
      playSoundSubmit();
      const overlay = document.createElement('div');
      overlay.className = 'bloom-overlay';
      document.body.appendChild(overlay);

      // Bloom opens → render content beneath → iris closes back to centre
      setTimeout(() => {
        onComplete();
        overlay.classList.add('closing');
        setTimeout(() => overlay.remove(), 580);
      }, 750);
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // RATING 5-STAR CONFETTI
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function triggerRatingConfetti() {
      playSoundFiveStar();
      const btn = document.getElementById('rating-tap-btn');
      if (!btn) return;
      const rect = btn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top  + rect.height / 2;
      const colors = [
        'rgba(184,119,58,0.88)', 'rgba(184,119,58,0.58)',
        'rgba(221,213,198,0.92)', 'rgba(155,95,30,0.72)',
      ];
      for (let i = 0; i < 22; i++) {
        const p = document.createElement('div');
        p.className = 'rc-particle';
        const size  = 4 + Math.random() * 8;
        const angle = Math.random() * Math.PI * 2;
        const dist  = 40 + Math.random() * 80;
        const tx    = (Math.cos(angle) * dist) + 'px';
        const ty    = (Math.sin(angle) * dist - 35) + 'px';
        const dur   = 0.5 + Math.random() * 0.38;
        const color = colors[Math.floor(Math.random() * colors.length)];
        p.style.cssText = [
          `width:${size}px`, `height:${size}px`,
          `left:${cx - size / 2}px`, `top:${cy - size / 2}px`,
          `background:${color}`,
          `--tx:${tx}`, `--ty:${ty}`,
          `animation-duration:${dur}s`,
        ].join(';');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), dur * 1000 + 60);
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // RESET
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    let _resetConfirming = false;
    let _resetTimer      = null;

    async function handleReset(date, yesterday) {
      const btn = document.getElementById('reset-btn');
      if (!btn) return;

      if (!_resetConfirming) {
        _resetConfirming = true;
        btn.textContent = 'Tap again to confirm';
        btn.classList.add('confirming');
        _resetTimer = setTimeout(() => {
          _resetConfirming = false;
          const b = document.getElementById('reset-btn');
          if (b) { b.textContent = 'Reset today'; b.classList.remove('confirming'); }
        }, 3000);
        return;
      }

      clearTimeout(_resetTimer);
      _resetConfirming = false;

      try {
        await fetch('/api/reset', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date, yesterday }),
        });
      } catch (err) {
        console.error('Reset error (non-fatal):', err);
      }

      ratingPromptHandled = false;
      loadApp();
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // COMMITMENT QUALITY HINT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    let _hintTimer = null;

    function handleCommitmentInput() {
      const text   = (document.getElementById('commitment-input')?.value || '').trim();
      const hintEl = document.getElementById('quality-hint');
      if (!hintEl) return;

      hintEl.classList.remove('visible', 'quality-vague', 'quality-specific', 'quality-exceptional');
      clearTimeout(_hintTimer);
      if (text.length < 18) return;

      _hintTimer = setTimeout(async () => {
        try {
          const res = await fetch('/api/hint', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ commitment: text }),
          });
          if (!res.ok) return;
          const { quality } = await res.json();
          const el = document.getElementById('quality-hint');
          if (el && quality) {
            el.textContent = quality;
            el.className = `quality-hint quality-${quality} visible`;
          }
        } catch {}
      }, 2000);
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // AUDIO
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    let _audioCtx = null;

    function getAudioCtx() {
      if (!_audioCtx) {
        _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      // iOS suspends audio until a user gesture — resume on every call
      if (_audioCtx.state === 'suspended') _audioCtx.resume();
      return _audioCtx;
    }

    // Core tone primitive: frequency, volume, duration, wave type, start delay
    function tone(freq, vol = 0.5, dur = 1.0, type = 'sine', start = 0) {
      try {
        const ctx  = getAudioCtx();
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
        gain.gain.setValueAtTime(0.001, ctx.currentTime + start);
        gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + start + 0.014);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + start + dur + 0.06);
      } catch {}
    }

    // ── Bell primitive: instant attack, exponential decay (sounds like a bowl/bell) ──
    function bell(freq, amp, decay, delay = 0) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const t = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const env = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      osc.connect(env);
      env.connect(ctx.destination);
      env.gain.setValueAtTime(amp, t);
      env.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      osc.start(t);
      osc.stop(t + decay + 0.05);
    }

    // ── Submit: Glacier — cold pure detuned pairs, instant attack, long fade ──
    function playSoundSubmit() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const t = ctx.currentTime;
      [[1047, 1049, 0.32, 8.0], [2093, 2095, 0.10, 5.0]].forEach(([f1, f2, amp, dec]) => {
        [f1, f2].forEach(freq => {
          const osc = ctx.createOscillator();
          const env = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          osc.connect(env);
          env.connect(ctx.destination);
          env.gain.setValueAtTime(amp, t);
          env.gain.exponentialRampToValueAtTime(0.0001, t + dec);
          osc.start(t);
          osc.stop(t + dec + 0.1);
        });
      });
    }

    // ── Rating ticks: Crystal — pure high sines, clean short decay ───────────
    const TICK_FREQS = [0, 1047, 1175, 1319, 1397, 1568]; // C6 D6 E6 F6 G6
    let _lastTick = 0;

    function playSoundRatingTick(step) {
      if (step < 1 || step > 4 || step === _lastTick) return;
      _lastTick = step;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const env = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(TICK_FREQS[step], t);
      osc.connect(env);
      env.connect(ctx.destination);
      env.gain.setValueAtTime(0.18, t);
      env.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      osc.start(t);
      osc.stop(t + 0.6);
    }

    // ── 5-star: Champagne — rising sparkle cascade ────────────────────────────
    function playSoundFiveStar() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const t = ctx.currentTime;
      [784, 1047, 1319, 1568, 2093].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const env = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        osc.connect(env);
        env.connect(ctx.destination);
        const s = t + i * 0.07;
        env.gain.setValueAtTime(0.22, s);
        env.gain.exponentialRampToValueAtTime(0.0001, s + 1.4 - i * 0.1);
        osc.start(s);
        osc.stop(s + 1.5);
      });
    }

    // ── Milestone: Carillon — three-bell tower sequence ──────────────────────
    function playSoundMilestone() {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const t = ctx.currentTime;
      [[523, t + 0.00], [392, t + 0.45], [784, t + 0.85]].forEach(([fund, s]) => {
        [[fund, fund + 2, 0.38], [fund * 2, fund * 2 + 3, 0.13]].forEach(([f1, f2, amp]) => {
          [f1, f2].forEach(freq => {
            const osc = ctx.createOscillator();
            const env = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, s);
            osc.connect(env);
            env.connect(ctx.destination);
            env.gain.setValueAtTime(amp, s);
            env.gain.exponentialRampToValueAtTime(0.0001, s + 3.5);
            osc.start(s);
            osc.stop(s + 3.6);
          });
        });
      });
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // SPECIAL CHALLENGE  ("I am special")
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    const SP_QUOTE = '"I am going to prevail<br>because I am special."';

    function shouldShowChallenge() {
      const key = `showup-challenge-${getTodayDate()}`;
      if (localStorage.getItem(key)) return false;   // already shown today
      if (Math.random() >= 0.25) return false;        // 75% skip
      localStorage.setItem(key, '1');
      return true;
    }

    let _spCount  = 0;
    let _spActive = false;
    let _spTimer  = null;
    let _spEl     = null;     // root overlay element

    function showSpecialChallenge() {
      try {
        const overlay = document.createElement('div');
        overlay.className = 'sp-overlay';
        overlay.innerHTML = `
          <div class="sp-card">
            <div class="sp-phase on" id="sp-offer">
              <div class="sp-eyebrow">Just for today ✦</div>
              <div class="sp-heading">Something a little different awaits.</div>
              <div class="sp-sub">This only comes around now and then.</div>
              <button class="sp-big-btn" id="sp-accept">${SP_QUOTE}</button>
              <button class="sp-skip" id="sp-skip">Not today →</button>
            </div>
            <div class="sp-phase" id="sp-game">
              <div class="sp-tap-label">times tapped</div>
              <span class="sp-tap-count" id="sp-cnt">0</span>
              <button class="sp-tap-btn" id="sp-tap">${SP_QUOTE}</button>
            </div>
            <div class="sp-phase" id="sp-result">
              <div class="sp-eyebrow">You did it</div>
              <span class="sp-result-score" id="sp-final">0</span>
              <div class="sp-result-unit">times</div>
              <div class="sp-result-msg">You're truly special.<br><strong>Go and prove it.</strong></div>
              <button class="sp-done-btn" id="sp-done">Continue →</button>
            </div>
          </div>`;
        document.body.appendChild(overlay);
        _spEl = overlay;

        overlay.querySelector('#sp-accept').addEventListener('click', _spStartGame);
        overlay.querySelector('#sp-skip').addEventListener('click', _spDismiss);
        overlay.querySelector('#sp-done').addEventListener('click', _spDismiss);
      } catch(e) { /* fail silently */ }
    }

    function _spPhase(id) {
      if (!_spEl) return;
      ['sp-offer','sp-game','sp-result'].forEach(p => {
        const el = _spEl.querySelector('#' + p);
        if (el) el.classList.toggle('on', p === id);
      });
    }

    function _spDismiss() {
      clearTimeout(_spTimer);
      _spActive = false;
      if (!_spEl) return;
      _spEl.classList.add('hiding');
      setTimeout(() => { if (_spEl) { _spEl.remove(); _spEl = null; } }, 300);
    }

    function _spStartGame() {
      try {
        _spCount = 0; _spActive = true;
        const cntEl = _spEl?.querySelector('#sp-cnt');
        if (cntEl) cntEl.textContent = '0';
        _spPhase('sp-game');
        playGlockenspiel();
        _spTimer = setTimeout(() => { _spActive = false; _spEndGame(); }, 10000);

        const tapBtn = _spEl?.querySelector('#sp-tap');
        if (tapBtn) {
          tapBtn.addEventListener('click', _spTap);
          tapBtn.addEventListener('touchstart', e => { e.preventDefault(); _spTap(); }, { passive: false });
        }
      } catch(e) { _spDismiss(); }
    }

    function _spTap() {
      if (!_spActive) return;
      _spCount++;
      playChallengeClick();
      const el = _spEl?.querySelector('#sp-cnt');
      if (!el) return;
      el.textContent = _spCount;
      el.classList.remove('sp-pop');
      void el.offsetWidth;                      // reflow — restart transition
      el.classList.add('sp-pop');
      setTimeout(() => el.classList.remove('sp-pop'), 100);
    }

    function _spEndGame() {
      clearTimeout(_spTimer);
      try {
        const el = _spEl?.querySelector('#sp-final');
        if (el) el.textContent = _spCount;
        _spPhase('sp-result');
        playChallengeResult();
        _spConfetti();
      } catch(e) { _spDismiss(); }
    }

    // ── Challenge sounds ─────────────────────────────────────────────────────

    function playGlockenspiel() {
      try {
        const ac = getAudioCtx();
        [1046.50, 1567.98].forEach((freq, i) => {
          const t = ac.currentTime + i * 0.14;
          const osc = ac.createOscillator(), gain = ac.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(0.25, t + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
          osc.connect(gain); gain.connect(ac.destination);
          osc.start(t); osc.stop(t + 0.82);
        });
      } catch {}
    }

    function playChallengeClick() {
      try {
        const ac = getAudioCtx();
        const t  = ac.currentTime;
        const buf  = ac.createBuffer(1, Math.ceil(ac.sampleRate * 0.04), ac.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++)
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 4);
        const src  = ac.createBufferSource();
        const filt = ac.createBiquadFilter();
        const gain = ac.createGain();
        filt.type = 'bandpass'; filt.frequency.value = 2200; filt.Q.value = 1.2;
        src.buffer = buf;
        gain.gain.setValueAtTime(0.35, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
        src.start(t); src.stop(t + 0.05);
      } catch {}
    }

    function playChallengeResult() {
      try {
        const ac = getAudioCtx();
        [1318.51, 1567.98, 2093.00, 2637.02].forEach((freq, i) => {
          const t = ac.currentTime + i * 0.06;
          const osc = ac.createOscillator(), gain = ac.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(0.18, t + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
          osc.connect(gain); gain.connect(ac.destination);
          osc.start(t); osc.stop(t + 1.15);
        });
        const osc2 = ac.createOscillator(), g2 = ac.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(3136, ac.currentTime);
        g2.gain.setValueAtTime(0.08, ac.currentTime);
        g2.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.9);
        osc2.connect(g2); g2.connect(ac.destination);
        osc2.start(); osc2.stop(ac.currentTime + 0.9);
      } catch {}
    }

    function _spConfetti() {
      try {
        const wrap = document.createElement('div');
        wrap.className = 'sp-confetti-wrap';
        document.body.appendChild(wrap);
        const colors = ['#8a6d4a','#6b4f3a','#a8895f','#ddd2bd','#4a3826','#c8b89a','#e0d4bc'];
        for (let i = 0; i < 70; i++) {
          const d = document.createElement('div');
          d.className = 'sp-dot';
          d.style.left   = Math.random() * 100 + 'vw';
          d.style.top    = '-12px';
          d.style.background       = colors[Math.floor(Math.random() * colors.length)];
          d.style.animationDelay   = (Math.random() * 1.4) + 's';
          d.style.animationDuration = (1.0 + Math.random() * 0.9) + 's';
          const size = 5 + Math.random() * 9;
          d.style.width        = size + 'px';
          d.style.height       = (size * (0.4 + Math.random() * 0.8)) + 'px';
          d.style.borderRadius = Math.random() > 0.5 ? '50%' : '1px';
          wrap.appendChild(d);
        }
        setTimeout(() => wrap.remove(), 3200);
      } catch {}
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // WEATHER
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    const WX_CACHE_KEY = 'showup-weather-v1';
    const WX_TTL = 30 * 60 * 1000; // 30 minutes
    let _weatherInited = false;

    const WMO_DESC = {
      0:'Clear sky', 1:'Mainly clear', 2:'Partly cloudy', 3:'Overcast',
      45:'Foggy', 48:'Foggy',
      51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
      61:'Light rain', 63:'Rainy', 65:'Heavy rain',
      71:'Light snow', 73:'Snowy', 75:'Heavy snow',
      80:'Light showers', 81:'Showers', 82:'Heavy showers',
      85:'Snow showers', 86:'Snow showers',
      95:'Thunderstorm', 96:'Thunderstorm', 99:'Thunderstorm',
    };

    function getCachedWeather() {
      try {
        const raw = localStorage.getItem(WX_CACHE_KEY);
        if (!raw) return null;
        const { ts, data } = JSON.parse(raw);
        if (Date.now() - ts < WX_TTL) return data;
      } catch {}
      return null;
    }

    function setCachedWeather(data) {
      try {
        localStorage.setItem(WX_CACHE_KEY, JSON.stringify({ ts: Date.now(), data }));
      } catch {}
    }

    function showWeatherSubline(text) {
      const el = document.getElementById('weather-subline');
      if (el) el.textContent = text;
    }

    async function fetchAndShowWeather(lat, lon) {
      try {
        const [wxRes, geoRes] = await Promise.all([
          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode&hourly=precipitation_probability&forecast_days=1&timezone=auto`),
          fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`),
        ]);
        if (!wxRes.ok) return;
        const wx = await wxRes.json();
        const geo = geoRes.ok ? await geoRes.json() : null;

        const temp = Math.round(wx.current.temperature_2m);
        const code = wx.current.weathercode;
        const cond = WMO_DESC[code] || 'Clear sky';
        const city = geo?.address?.city || geo?.address?.town || geo?.address?.village || geo?.address?.county || '';

        // Afternoon rain: average precipitation_probability for hours 12–17
        const pp = wx.hourly?.precipitation_probability || [];
        const avgPP = pp.slice(12, 18).reduce((a, b) => a + b, 0) / (pp.slice(12, 18).length || 1);
        const rainNote = avgPP > 40 ? ' Rain likely this afternoon.' : '';

        const cityPart = city ? ` in ${city}` : '';
        const text = `${cond}${cityPart}, ${temp}°C.${rainNote}`;

        setCachedWeather({ text });
        showWeatherSubline(text);
      } catch {}
    }

    function initWeather() {
      const el = document.getElementById('weather-subline');
      if (!el) return;

      // Show cached data immediately if fresh
      const cached = getCachedWeather();
      if (cached) { showWeatherSubline(cached.text); return; }

      // Show button to request geolocation (required for iOS PWA first-time)
      if (!navigator.geolocation) return;
      const btn = document.createElement('button');
      btn.className = 'weather-btn';
      btn.textContent = 'Get local weather';
      btn.onclick = () => {
        btn.remove();
        navigator.geolocation.getCurrentPosition(
          pos => fetchAndShowWeather(pos.coords.latitude, pos.coords.longitude),
          () => {} // permission denied — stay silent
        );
      };
      el.appendChild(btn);
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // WORD CLOUD
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    const STOP_WORDS = new Set([
      'the','and','to','i','a','in','my','it','is','that','of','for','on','with',
      'this','was','be','have','do','at','from','by','not','but','or','we','an',
      'so','up','if','as','me','will','all','just','into','how','more','out','can',
      'had','has','been','were','are','they','their','there','about','would','when',
      'what','get','got','did','make','made','one','our','day','today','time','very',
      'will','then','than','its','also','like','im','ive','ill','dont','wont',
    ]);

    const CLOUD_COLORS = ['#6b4f3a','#8a6d4a','#a8895f','#4a3826','#7d6444','#9c7a52'];

    async function loadWordCloud(totalCount) {
      const section = document.getElementById('wordcloud-section');
      if (!section) return;

      // Show "on its way" before 10 entries
      if (totalCount < 10) {
        if (totalCount > 0) {
          section.style.display = '';
          document.getElementById('wordcloud-bg').innerHTML =
            '<div class="cloud-empty">Keep showing up —<br>your word cloud is on its way.</div>';
        }
        return;
      }

      section.style.display = '';

      try {
        const res = await fetch('/api/words');
        if (!res.ok) { section.style.display = 'none'; return; }
        const { texts } = await res.json();
        if (!texts?.length) { section.style.display = 'none'; return; }

        // Tokenize and count
        const freq = {};
        texts.forEach(t => {
          if (!t) return;
          t.toLowerCase()
            .replace(/[^a-z\s]/g, ' ')
            .split(/\s+/)
            .filter(w => w.length > 2 && !STOP_WORDS.has(w))
            .forEach(w => { freq[w] = (freq[w] || 0) + 1; });
        });

        const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 45);
        if (!sorted.length) { section.style.display = 'none'; return; }

        const maxFreq = sorted[0][1];
        const minFreq = sorted[sorted.length - 1][1];
        const range   = Math.max(maxFreq - minFreq, 1);

        // Shuffle so the layout isn't just a sorted list
        const shuffled = [...sorted];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }

        const bg = document.getElementById('wordcloud-bg');
        bg.innerHTML = '';
        shuffled.forEach(([word, count], idx) => {
          const t = (count - minFreq) / range;        // 0..1
          const size  = Math.round(14 + t * 40);      // 14px..54px
          const color = CLOUD_COLORS[idx % CLOUD_COLORS.length];
          const span  = document.createElement('span');
          span.className = 'cloud-word';
          span.textContent = word;
          span.style.cssText = `font-size:${size}px;color:${color};`;
          bg.appendChild(span);
        });
      } catch {
        section.style.display = 'none';
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // MILESTONE IMAGE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    let _currentStreak = 0;

    function renderMilestoneCanvas(streak) {
      const W = 540, H = 540;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const c = canvas.getContext('2d');

      // Background: warm beige radial gradient
      const grad = c.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.72);
      grad.addColorStop(0, '#f6f1e6');
      grad.addColorStop(1, '#e7dcc6');
      c.fillStyle = grad;
      c.fillRect(0, 0, W, H);

      // Border inset 28px
      const inset = 28;
      c.strokeStyle = '#8a6d4a';
      c.lineWidth = 1.5;
      c.strokeRect(inset + 0.75, inset + 0.75, W - inset * 2 - 1.5, H - inset * 2 - 1.5);

      // "ShowUp" italic top
      c.fillStyle = '#8a6d4a';
      c.font = 'italic 30px Georgia, serif';
      c.textAlign = 'center';
      c.fillText('ShowUp', W / 2, 118);

      // Thin rule below
      c.strokeStyle = 'rgba(138,109,74,0.45)';
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(W/2 - 44, 138); c.lineTo(W/2 + 44, 138);
      c.stroke();

      // Streak number
      const numStr = String(streak);
      const fontSize = numStr.length >= 3 ? 136 : 164;
      c.fillStyle = '#4a3826';
      c.font = `bold ${fontSize}px Georgia, serif`;
      c.textAlign = 'center';
      c.fillText(numStr, W / 2, 320);

      // "MORNINGS SHOWN UP"
      c.fillStyle = '#8a6d4a';
      c.font = '19px Georgia, serif';
      c.textAlign = 'center';
      c.fillText('MORNINGS  SHOWN  UP', W / 2, 372);

      // Rule
      c.strokeStyle = 'rgba(138,109,74,0.40)';
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(W/2 - 64, 400); c.lineTo(W/2 + 64, 400);
      c.stroke();

      // "Your daily morning routine" italic bottom
      c.fillStyle = '#a8895f';
      c.font = 'italic 18px Georgia, serif';
      c.textAlign = 'center';
      c.fillText('Your daily morning routine', W / 2, 440);

      return canvas;
    }

    function showMilestoneImageModal(streak) {
      streak = streak || _currentStreak;
      if (!streak) return;

      const canvas = renderMilestoneCanvas(streak);
      canvas.className = 'ms-img-canvas';

      const modal = document.createElement('div');
      modal.className = 'ms-img-modal';

      const card = document.createElement('div');
      card.className = 'ms-img-card';

      const actions = document.createElement('div');
      actions.className = 'ms-img-actions';
      actions.innerHTML = `
        <button class="ms-img-download" onclick="downloadMilestoneImage(${streak})">↓ Save image</button>
        <button class="ms-img-close" onclick="closeMilestoneImageModal()">Close</button>
      `;

      card.appendChild(canvas);
      card.appendChild(actions);
      modal.appendChild(card);
      document.body.appendChild(modal);
      window.__milestoneCanvas = canvas;
    }

    function closeMilestoneImageModal() {
      const modal = document.querySelector('.ms-img-modal');
      if (!modal) return;
      modal.classList.add('hiding');
      setTimeout(() => modal.remove(), 300);
    }

    function downloadMilestoneImage(streak) {
      const canvas = window.__milestoneCanvas;
      if (!canvas) return;
      const link = document.createElement('a');
      link.download = `showup-${streak}-days.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // UTILS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function esc(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // INIT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // Sync offline draft as soon as connectivity returns
    window.addEventListener('online', () => {
      if (localStorage.getItem('showup-draft')) loadApp();
    });

    document.addEventListener('DOMContentLoaded', loadApp);

    // Register service worker for shell caching
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    }
  </script>
