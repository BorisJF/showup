<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOW UP</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <!-- Papier Tigre theme typeface (only used when the alt skin is active) -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <!-- Apply saved style before paint to avoid a flash.
       Cutestom is the default; the warm-serif original is opt-in.
       Note the attribute value stays "papier" for backwards compatibility —
       every themed rule below is keyed on it. -->
  <script>(function(){var warm=false;try{warm=localStorage.getItem('showup-theme')==='warm';}catch(e){}if(!warm){document.documentElement.setAttribute('data-theme','papier');}})();</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #ede8df;
      --text:        #28201a;
      --muted:       #9a8b7b;
      --amber:       #b8773a;
      --amber-light: rgba(184, 119, 58, 0.10);
      --card:        #ffffff;
      --card-border: rgba(40, 32, 26, 0.09);
      --card-shadow: 0 1px 4px rgba(40, 32, 26, 0.08);
      --badge-bg:    #ddd5c6;
      --rule-color:  rgba(184, 119, 58, 0.45);
    }

    html { background: var(--bg); }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      font-size: 16px;
      line-height: 1.55;
      max-width: 500px;
      margin: 0 auto;
      padding: 28px 20px 88px;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    #app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .date-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border-radius: 100px;
      padding: 7px 14px 7px 11px;
      box-shadow: 0 1px 6px rgba(40, 32, 26, 0.13);
    }

    .streak-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
      flex-shrink: 0;
    }

    .streak-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
    }

    .streak-milestone-line {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      color: var(--amber);
      text-align: right;
      margin-top: 5px;
      letter-spacing: 0.08em;
      min-height: 14px;
    }

    /* ── GREETING ── */
    .greeting {
      text-align: center;
      font-size: 22px;
      font-style: italic;
      color: var(--text);
      margin-bottom: 26px;
      text-wrap: balance;
    }

    /* ── REMEMBER THIS ── */
    .remember-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .remember-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 14px;
    }

    .remember-line1 {
      font-size: 35px;
      font-weight: 400;
      line-height: 1.25;
      color: var(--text);
      text-wrap: balance;
    }

    .remember-line2 {
      font-size: 37px;
      font-weight: 500;
      font-style: italic;
      line-height: 1.25;
      color: var(--amber);
      text-wrap: balance;
    }

    .remember-rule {
      width: 38px;
      height: 2px;
      background: var(--rule-color);
      margin: 18px auto 0;
      border-radius: 1px;
    }

    /* ── THREE WAYS TO RESPOND ───────────────────────────────────────────
       A standing frame, collapsed by default. The chips stay visible when
       closed so the three names are always in view — that's most of the
       value, and it costs almost no vertical space. */
    .ways-card {
      margin-bottom: 18px;
      padding: 14px 16px 15px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      box-shadow: var(--card-shadow);
    }

    .ways-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0;
      background: none;
      border: none;
      cursor: pointer;
      font: inherit;
      color: inherit;
      text-align: left;
    }

    .ways-eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--amber);
    }

    .ways-chevron {
      font-size: 12px;
      color: var(--muted);
      transition: transform 0.18s ease;
    }
    .ways-card.open .ways-chevron { transform: rotate(180deg); }

    .ways-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 11px;
    }
    .ways-card.open .ways-chips { display: none; }

    .ways-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--amber-light);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .ways-chip-emoji { font-size: 12px; }

    .ways-body { margin-top: 13px; }

    .ways-intro {
      margin: 0 0 13px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
      text-wrap: pretty;
    }

    .ways-item {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      padding: 9px 0;
      border-top: 1px solid var(--card-border);
    }
    .ways-item:first-of-type { border-top: none; padding-top: 0; }

    .ways-item-emoji {
      flex: 0 0 auto;
      font-size: 20px;
      line-height: 1.3;
    }

    .ways-item-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 3px;
    }

    .ways-item-def {
      font-size: 14px;
      line-height: 1.5;
      color: var(--muted);
      text-wrap: pretty;
    }

    /* ── BODY & MIND ─────────────────────────────────────────────────────
       Two habits, ticked at any hour. Never part of the streak. */
    .habit-card {
      margin-bottom: 34px;
      padding: 14px 16px 15px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      box-shadow: var(--card-shadow);
    }

    .habit-eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--amber);
    }

    .habit-line {
      margin-top: 9px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
      text-wrap: pretty;
    }

    .habit-toggles {
      display: flex;
      gap: 9px;
      margin-top: 13px;
    }

    .habit-toggle {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 11px 10px;
      background: transparent;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.08s;
      -webkit-tap-highlight-color: transparent;
    }
    .habit-toggle:active { transform: scale(0.97); }

    .habit-emoji {
      font-size: 16px;
      filter: grayscale(1);
      opacity: 0.45;
      transition: filter 0.15s, opacity 0.15s;
    }

    .habit-check {
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .habit-toggle.on {
      background: var(--amber-light);
      border-color: var(--amber);
      color: var(--text);
    }
    .habit-toggle.on .habit-emoji { filter: none; opacity: 1; }
    .habit-toggle.on .habit-check { opacity: 1; color: var(--amber); }

    /* ── SECTION HEADER + LINE ── */
    .section-header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: rgba(40, 32, 26, 0.12);
    }

    /* ── FOCUS CARDS ── */
    .focus-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      margin-bottom: 10px;
      transition: border-color 0.14s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .focus-card.selected {
      border-color: var(--amber);
    }

    .letter-badge {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 10px;
      background: var(--badge-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      font-weight: 600;
      font-style: normal;
      color: var(--text);
      font-family: 'Lora', Georgia, serif;
    }

    .card-name {
      flex: 1;
      font-size: 19px;
      font-weight: 400;
      font-style: normal;
      color: var(--text);
      text-wrap: pretty;
    }

    .radio-circle {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 2px solid rgba(40, 32, 26, 0.20);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.14s, background 0.14s;
    }

    .focus-card.selected .radio-circle {
      border-color: var(--amber);
      background: var(--amber);
    }

    .focus-card.selected .radio-circle::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
    }

    /* ── COMMITMENT TEXTAREA ── */
    .commitment-group {
      margin-top: 26px;
    }

    .field-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      display: block;
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      color: var(--text);
      font-family: 'Lora', Georgia, serif;
      font-size: 19px;
      padding: 14px 16px;
      outline: none;
      resize: none;
      min-height: 88px;
      line-height: 1.55;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.14s;
    }

    textarea:focus {
      border-color: rgba(40, 32, 26, 0.28);
    }

    textarea::placeholder {
      color: rgba(40, 32, 26, 0.22);
      font-style: italic;
    }

    /* ── COMMIT BUTTON ── */
    .commit-btn {
      width: 100%;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: 17px;
      cursor: pointer;
      margin-top: 14px;
      transition: opacity 0.12s;
    }

    .commit-btn:hover  { opacity: 0.88; }
    .commit-btn:active { opacity: 0.72; }
    .commit-btn:disabled { opacity: 0.32; cursor: not-allowed; }

    /* ── CHANGE PILL ── */
    .change-btn {
      display: block;
      margin: 12px auto 0;
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      padding: 7px 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--muted);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.14s, color 0.14s;
    }
    .change-btn:hover  { border-color: rgba(40, 32, 26, 0.18); color: var(--text); }
    .change-btn:active { opacity: 0.7; }

    /* ── LANGUAGE FLAGS (very top) ── */
    #lang-flags {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-bottom: 8px;
    }
    .flag-btn {
      background: none;
      border: none;
      padding: 0;
      line-height: 0;
      cursor: pointer;
      border-radius: 3px;
      opacity: 0.3;
      filter: grayscale(0.6);
      transition: opacity 0.18s, filter 0.18s, box-shadow 0.18s;
      -webkit-tap-highlight-color: transparent;
    }
    .flag-btn:hover { opacity: 0.7; filter: grayscale(0.2); }
    .flag-btn.on {
      opacity: 1;
      filter: none;
      box-shadow: 0 0 0 1.5px var(--card-border);
    }
    .flag-btn svg { display: block; border-radius: 3px; }

    /* ── ACT LABEL ACCENT ── */
    .act-letter {
      color: var(--amber);
      font-weight: 600;
    }

    .error-msg {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px;
      color: #b03030;
      margin-top: 10px;
    }

    /* ── LOCKED ENTRY ── */
    .locked-field {
      margin-bottom: 20px;
    }

    .locked-value {
      font-size: 20px;
      line-height: 1.55;
      color: var(--text);
      text-wrap: pretty;
    }

    /* ── DAILY MESSAGE ── */
    .message-card {
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      box-shadow: var(--card-shadow);
      padding: 20px;
      margin-top: 22px;
    }

    .message-mode {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 10px;
    }

    .message-text {
      font-size: 20px;
      font-style: italic;
      line-height: 1.62;
      color: var(--text);
      text-wrap: pretty;
    }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: rgba(40, 32, 26, 0.10);
      margin: 38px 0;
    }

    /* ── RECENT MORNINGS ── */
    .morning-entry {
      padding: 14px 0;
      border-bottom: 1px solid rgba(40, 32, 26, 0.08);
    }

    .morning-entry:last-child { border-bottom: none; }

    .morning-date {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .morning-focus {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .morning-commitment {
      font-size: 17px;
      color: var(--muted);
      font-style: italic;
      line-height: 1.4;
      text-wrap: pretty;
    }

    .empty-state {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 14px;
      color: var(--muted);
    }

    /* ── MORNING RATING DOTS (history) ── */
    .morning-rating {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      align-items: center;
    }

    .morning-rating-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(40, 32, 26, 0.12);
    }

    .morning-rating-dot.filled {
      background: var(--amber);
    }

    /* ── RATING SCREEN ── */
    .rating-context {
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 32px;
    }

    .rating-context-date {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 8px;
    }

    .rating-context-focus {
      font-size: 19px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .rating-context-commitment {
      font-size: 17px;
      color: var(--muted);
      font-style: italic;
      line-height: 1.4;
      text-wrap: pretty;
    }

    .rating-btn-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 26px;
    }

    .rating-tap-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      background: var(--badge-bg);
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: transform 0.1s ease;
    }

    .rating-ring-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: rotate(-90deg);
      pointer-events: none;
    }

    .rating-ring-bg {
      fill: none;
      stroke: rgba(40, 32, 26, 0.08);
      stroke-width: 6;
    }

    .rating-ring-fill {
      fill: none;
      stroke: var(--amber);
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.25s ease, stroke 0.25s ease;
    }

    .rating-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0 30px;
      pointer-events: none;
    }

    .rating-number {
      font-family: 'Lora', Georgia, serif;
      font-size: 58px;
      font-weight: 500;
      line-height: 1;
      color: var(--text);
      transition: color 0.2s;
    }

    .rating-hint {
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      line-height: 1.3;
      color: var(--muted);
      font-style: italic;
      max-width: 150px;
      transition: opacity 0.2s;
    }

    .rating-skip {
      display: block;
      margin: 0 auto;
      background: none;
      border: none;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 12px;
      cursor: pointer;
      padding: 8px 12px;
      opacity: 0.65;
      letter-spacing: 0.04em;
    }

    .rating-skip:hover { opacity: 1; }

    /* ── MILESTONE CELEBRATION ── */
    .milestone-overlay {
      position: fixed;
      inset: 0;
      background: rgba(237, 232, 223, 0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
      overflow: hidden;
      animation: ms-fade-in 0.5s ease forwards;
    }

    .milestone-overlay.hiding {
      animation: ms-fade-out 0.7s ease forwards;
      pointer-events: none;
    }

    @keyframes ms-fade-in  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes ms-fade-out { from { opacity: 1; } to { opacity: 0; } }

    .milestone-day-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--amber);
      animation: ms-rise 0.7s 0.1s ease both;
    }

    .milestone-number {
      font-family: 'Lora', Georgia, serif;
      font-size: 108px;
      font-weight: 600;
      color: var(--text);
      line-height: 1;
      animation: ms-pop 0.65s 0.15s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .milestone-message {
      font-family: 'Lora', Georgia, serif;
      font-size: 20px;
      font-style: italic;
      color: var(--text);
      text-align: center;
      max-width: 290px;
      line-height: 1.45;
      margin-top: 18px;
      animation: ms-rise 0.7s 0.35s ease both;
    }

    .milestone-dismiss {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-top: 52px;
      animation: ms-rise 0.7s 0.65s ease both;
    }

    @keyframes ms-pop {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    @keyframes ms-rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    .ms-particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: ms-particle-float linear forwards;
    }

    @keyframes ms-particle-float {
      0%   { opacity: 0.75; transform: translateY(0)     translateX(0)            scale(1);   }
      100% { opacity: 0;    transform: translateY(-300px) translateX(var(--drift)) scale(0.2); }
    }

    /* ── THE BLOOM (submit celebration) ── */
    .bloom-overlay {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 500;
      background: radial-gradient(
        circle at 50% 50%,
        rgba(184, 119, 58, 0.90) 0%,
        rgba(196, 138, 65, 0.75) 42%,
        rgba(218, 172, 100, 0.48) 100%
      );
      clip-path: circle(0% at 50% 50%);
      animation: bloom-open 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    .bloom-overlay.closing {
      clip-path: circle(150% at 50% 50%);
      animation: bloom-close 0.55s cubic-bezier(0.4, 0, 0.8, 0.2) forwards;
    }
    @keyframes bloom-open {
      from { clip-path: circle(0% at 50% 50%); }
      to   { clip-path: circle(150% at 50% 50%); }
    }
    @keyframes bloom-close {
      from { clip-path: circle(150% at 50% 50%); }
      to   { clip-path: circle(0% at 50% 50%); }
    }
    /* Papier Tigre recolours the bloom hot pink (#c98fa4); the default
       warm-serif theme keeps its brown wash. */
    html[data-theme="papier"] .bloom-overlay {
      background: radial-gradient(
        circle at 50% 50%,
        rgba(201, 143, 164, 0.92) 0%,
        rgba(201, 143, 164, 0.78) 42%,
        rgba(217, 193, 210, 0.46) 100%
      );
    }

    /* ── SPLASH SCREEN ── */
    #splash {
      position: fixed; inset: 0;
      background: #fdf9f5; /* matches the standard logo's cream background */
      display: flex;
      align-items: center; justify-content: center;
      z-index: 3000;
      transition: opacity 0.75s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    /* Papier Tigre uses the holographic logo, whose background is pure white */
    html[data-theme="papier"] #splash { background: #ffffff; }

    #sp-logo {
      width: min(62vw, 240px);
      height: auto;
      animation: spLogoIn 1.0s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes spLogoIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

    /* ── RATING 5-STAR CONFETTI ── */
    .rc-particle {
      position: fixed; border-radius: 50%;
      pointer-events: none; z-index: 600;
      animation: rc-burst ease-out forwards;
    }
    @keyframes rc-burst {
      0%   { opacity: 1;  transform: translate(0, 0) scale(1); }
      100% { opacity: 0;  transform: translate(var(--tx), var(--ty)) scale(0.1); }
    }

    /* ── SLIDE TO RESET ── */
    .reset-slider {
      margin: 34px auto 0;
      max-width: 230px;
    }
    .reset-track {
      position: relative;
      height: 38px;
      border-radius: 100px;
      background: rgba(40, 32, 26, 0.035);
      border: 1px solid rgba(40, 32, 26, 0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .reset-track-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(154, 139, 123, 0.7);
      pointer-events: none;
      transition: opacity 0.2s, color 0.2s;
    }
    .reset-thumb {
      position: absolute;
      left: 3px; top: 3px;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid rgba(40, 32, 26, 0.10);
      box-shadow: 0 1px 3px rgba(40, 32, 26, 0.12);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      font-size: 15px;
      cursor: grab;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .reset-thumb:active { cursor: grabbing; }
    .reset-track.armed {
      background: var(--amber-light);
      border-color: rgba(184, 119, 58, 0.32);
    }
    .reset-track.armed .reset-track-label { color: var(--amber); opacity: 0.4; }
    .reset-track.armed .reset-thumb { color: var(--amber); border-color: rgba(184, 119, 58, 0.4); }

    /* ── COMMITMENT QUALITY HINT ── */
    .quality-hint {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
      min-height: 16px; margin-top: 7px;
      opacity: 0; transition: opacity 0.4s;
    }
    .quality-hint.visible   { opacity: 1; }
    .quality-vague          { color: var(--muted); }
    .quality-specific       { color: var(--amber); }
    .quality-exceptional    { color: var(--amber); font-weight: 700; letter-spacing: 0.22em; }

    /* ── OFFLINE BANNER ── */
    .offline-saved { text-align: center; padding: 28px 0 8px; }
    .offline-saved-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--amber); margin-bottom: 12px;
    }
    .offline-saved-msg {
      font-size: 19px; font-style: italic; color: var(--muted); line-height: 1.55;
    }

    /* ── LOADING ── */
    .loading {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px;
      color: var(--muted);
    }

    /* ── SIMULATE (testing only) ── */
    .test-area {
      margin-top: 52px;
      text-align: center;
    }

    .simulate-btn {
      background: transparent;
      border: 1px solid rgba(40, 32, 26, 0.15);
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s;
    }

    .simulate-btn:hover {
      color: var(--text);
      border-color: rgba(40, 32, 26, 0.3);
    }

    .simulate-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ── WORD CLOUD ─────────────────────────────────── */
    .wordcloud-container {
      margin-top: 44px;
    }

    .wordcloud-bg {
      border-radius: 16px;
      padding: 28px 18px 24px;
      background: linear-gradient(160deg, #fbf9f4 0%, #f4efe4 100%);
      min-height: 180px;
      display: flex;
      flex-wrap: wrap;
      gap: 9px 13px;
      justify-content: center;
      align-items: center;
    }

    .cloud-word {
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      cursor: default;
      line-height: 1.1;
      display: inline-block;
      padding: 5px 13px;
      border-radius: 20px;
      background: #ecdac6;
      color: #4a3826;
      border: 1px solid rgba(74, 56, 38, 0.10);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cloud-word:hover { transform: scale(1.08) rotate(-1.5deg); }

    /* warm pill tints by class (theme overrides recolour them into stickers) */
    .cw-0{background:#e7d3bd}.cw-1{background:#ecdac6}.cw-2{background:#e3cdb2}.cw-3{background:#efe0cb}.cw-4{background:#e9d6bf}.cw-5{background:#f3e8d6}

    .cloud-empty {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: 15px;
      color: #9c7a52;
      text-align: center;
      padding: 20px 8px;
      line-height: 1.8;
      width: 100%;
    }

    /* ── SPECIAL CHALLENGE ──────────────────────────── */
    .sp-overlay {
      position: fixed; inset: 0; z-index: 5000;
      background: rgba(74, 56, 38, 0.65);
      display: flex; align-items: center; justify-content: center;
      padding: 24px 20px;
      animation: spOverIn 0.35s ease forwards;
    }
    @keyframes spOverIn  { from { opacity: 0; } to { opacity: 1; } }
    .sp-overlay.hiding   { animation: spOverOut 0.28s ease forwards; }
    @keyframes spOverOut { from { opacity: 1; } to { opacity: 0; } }

    .sp-card {
      background: #fbf9f4; border: 1px solid #ddd2bd; border-radius: 22px;
      padding: 36px 28px; max-width: 380px; width: 100%;
      box-shadow: 0 12px 50px rgba(100,80,50,.18); text-align: center;
    }

    .sp-phase { display: none; }
    .sp-phase.on { display: block; animation: spPhaseIn .35s ease; }
    @keyframes spPhaseIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    .sp-eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      color: #9c8a6f; margin-bottom: 18px;
    }
    .sp-heading { font-size: 22px; line-height: 1.35; color: #4a3826; margin-bottom: 10px; }
    .sp-sub { font-size: 14px; color: #9c8a6f; font-style: italic; margin-bottom: 32px; }

    .sp-big-btn {
      width: 100%; padding: 22px 16px; background: #6b4f3a; color: #fbf9f4;
      border: none; border-radius: 14px; font-family: Georgia, serif;
      font-size: 17px; line-height: 1.4; cursor: pointer;
      box-shadow: 0 6px 24px rgba(100,70,30,.22);
      transition: background .18s, transform .18s, box-shadow .18s;
    }
    .sp-big-btn:hover {
      background: #4a3826; transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(100,70,30,.3);
    }
    .sp-big-btn:active { transform: translateY(1px); }

    .sp-skip {
      display: block; margin-top: 16px; font-size: 13px; color: #9c8a6f;
      cursor: pointer; font-style: italic; background: none; border: none;
      font-family: Georgia, serif; width: 100%;
    }
    .sp-skip:hover { color: #4a3826; }

    .sp-tap-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
      color: #9c8a6f; margin-bottom: 10px;
    }
    .sp-tap-count {
      display: block; font-size: 88px; font-weight: 700; color: #6b4f3a;
      line-height: 1; margin-bottom: 28px;
      transition: transform .08s, color .08s;
    }
    .sp-tap-count.sp-pop { transform: scale(1.2); color: #8a6d4a; }

    .sp-tap-btn {
      width: 100%; padding: 26px 16px; background: #6b4f3a; color: #fbf9f4;
      border: none; border-radius: 16px; font-family: Georgia, serif;
      font-size: 18px; line-height: 1.4; cursor: pointer; user-select: none;
      box-shadow: 0 6px 24px rgba(100,70,30,.24);
      transition: transform .07s, box-shadow .07s;
      -webkit-tap-highlight-color: transparent;
    }
    .sp-tap-btn:active { transform: scale(.96); box-shadow: 0 2px 10px rgba(100,70,30,.18); }

    .sp-result-score {
      display: block; font-size: 100px; font-weight: 700; color: #6b4f3a;
      line-height: 1; margin: 0 0 4px;
    }
    .sp-result-unit {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
      color: #9c8a6f; margin-bottom: 28px;
    }
    .sp-result-msg { font-size: 20px; line-height: 1.5; color: #4a3826; margin-bottom: 32px; }
    .sp-result-msg strong { color: #8a6d4a; font-weight: 700; font-style: normal; }

    .sp-done-btn {
      padding: 14px 32px; background: transparent;
      border: 1.5px solid #8a6d4a; border-radius: 100px;
      font-family: Georgia, serif; font-size: 14px; color: #8a6d4a;
      cursor: pointer; transition: .2s;
    }
    .sp-done-btn:hover { background: #8a6d4a; color: #fbf9f4; }

    .sp-confetti-wrap {
      position: fixed; inset: 0; pointer-events: none;
      overflow: hidden; z-index: 6000;
    }
    .sp-dot {
      position: absolute; border-radius: 2px; opacity: 0;
      animation: spDotFall 1.6s ease-in forwards;
    }
    @keyframes spDotFall {
      0%   { opacity: 1; transform: translateY(-10px) rotate(0deg) scale(1); }
      100% { opacity: 0; transform: translateY(100vh) rotate(900deg) scale(.4); }
    }

    /* ── SPECIAL CHALLENGE · Papier Tigre sticker restyle ──
       Bold flat colours, hard black borders, offset shadows, Archivo.
       Default warm-serif game is untouched. */
    html[data-theme="papier"] .sp-overlay { background: rgba(22, 22, 22, 0.55); }
    html[data-theme="papier"] .sp-card {
      border-radius: 10px;
      background: #ffffff; border: 3px solid #161616; border-radius: 22px;
      box-shadow: 8px 8px 0 #161616;
      font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    }
    html[data-theme="papier"] .sp-eyebrow,
    html[data-theme="papier"] .sp-tap-label,
    html[data-theme="papier"] .sp-result-unit {
      font-family: 'Archivo', sans-serif; font-weight: 700;
      color: #161616; letter-spacing: .12em;
    }
    html[data-theme="papier"] .sp-heading {
      font-family: 'Archivo', sans-serif; font-weight: 900; color: #161616;
    }
    html[data-theme="papier"] .sp-sub {
      font-family: 'Archivo', sans-serif; font-style: normal;
      font-weight: 500; color: #6c6f72;
    }
    html[data-theme="papier"] .sp-big-btn {
      background: #c98fa4; color: #fdf9f5;
      font-family: 'Archivo', sans-serif; font-weight: 900;
      border: 3px solid #161616; border-radius: 14px;
      box-shadow: 5px 5px 0 #161616;
      transition: transform .12s, box-shadow .12s;
    }
    html[data-theme="papier"] .sp-big-btn:hover {
      background: #c98fa4; transform: translate(-1px,-1px);
      box-shadow: 6px 6px 0 #161616;
    }
    html[data-theme="papier"] .sp-big-btn:active {
      transform: translate(2px,2px); box-shadow: 2px 2px 0 #161616;
    }
    html[data-theme="papier"] .sp-skip {
      font-family: 'Archivo', sans-serif; font-style: normal;
      font-weight: 700; color: #6c6f72; text-decoration: underline;
    }
    html[data-theme="papier"] .sp-skip:hover { color: #161616; }
    html[data-theme="papier"] .sp-tap-count {
      font-family: 'Archivo', sans-serif; font-weight: 900; color: #7e83c0;
    }
    html[data-theme="papier"] .sp-tap-count.sp-pop { color: #c98fa4; }
    html[data-theme="papier"] .sp-tap-btn {
      background: #7cbb9e; color: #161616;
      font-family: 'Archivo', sans-serif; font-weight: 900;
      border: 3px solid #161616; border-radius: 16px;
      box-shadow: 5px 5px 0 #161616;
      transition: transform .07s, box-shadow .07s;
    }
    html[data-theme="papier"] .sp-tap-btn:active {
      transform: translate(2px,2px); box-shadow: 2px 2px 0 #161616;
    }
    html[data-theme="papier"] .sp-result-score {
      font-family: 'Archivo', sans-serif; font-weight: 900; color: #c98fa4;
    }
    html[data-theme="papier"] .sp-result-msg {
      font-family: 'Archivo', sans-serif; color: #161616; font-weight: 500;
    }
    html[data-theme="papier"] .sp-result-msg strong { color: #161616; font-weight: 900; }
    html[data-theme="papier"] .sp-done-btn {
      background: #a987b0; color: #fdf9f5;
      font-family: 'Archivo', sans-serif; font-weight: 900;
      border: 3px solid #161616; border-radius: 12px;
      box-shadow: 4px 4px 0 #161616; transition: transform .12s, box-shadow .12s;
    }
    html[data-theme="papier"] .sp-done-btn:hover {
      background: #a987b0; color: #fdf9f5;
      transform: translate(-1px,-1px); box-shadow: 5px 5px 0 #161616;
    }
    html[data-theme="papier"] .sp-done-btn:active {
      transform: translate(2px,2px); box-shadow: 1px 1px 0 #161616;
    }
    html[data-theme="papier"] .sp-dot { border: 1px solid #161616; }

    /* ════════════════════════════════════════════════════════════
       PAPIER TIGRE THEME · "Holographique"
       Active only when <html data-theme="papier">. Non-destructive —
       the original warm-serif design remains the default.
       White base, iridescent hero, pink offset-shadow buttons.
       ════════════════════════════════════════════════════════════ */
    html[data-theme="papier"] {
      --bg:          #ffffff;   /* clean white paper */
      --text:        #161616;   /* ink */
      --muted:       #6c6f72;
      --amber:       #161616;   /* accents go editorial-black; colour lives in the hero */
      --amber-light: rgba(22, 22, 22, 0.06);
      --card:        #ffffff;
      --card-border: rgba(22, 22, 22, 0.16);
      --card-shadow: 0 2px 0 0 rgba(22, 22, 22, 0.05);
      --badge-bg:    #c5d4e0;   /* powder blue (fallback) */
      --rule-color:  #161616;   /* sharp black rules */
      --pt-holo: linear-gradient(160deg,
        #7e83c0 0%, #a987b0 12%, #c98fa4 22%, #d9c1d2 34%,
        #f0ebdd 50%, #e7ecda 62%, #bfe0ce 76%, #a6d9c2 90%, #bcdcd6 100%);
      /* Accents, all sampled from the band above. */
      --pt-indigo: #7e83c0;
      --pt-rose:   #c98fa4;
      --pt-mint:   #7cbb9e;
      --pt-plum:   #a987b0;
      --pt-pink:   #c98fa4;   /* legacy alias → rose */
    }


    /* ── The two new cards, in Cutestom ──────────────────────────────────
       One pastel accent each, drawn from the band: plum for the frame,
       mint for the habits. Chips are solid pastel with white Archivo,
       and the eyebrow rules disappear — whitespace does the separating. */
    html[data-theme="papier"] .ways-card,
    html[data-theme="papier"] .habit-card {
      background: #ffffff;
      border: 1px solid #161616;
      border-radius: 10px;
    }
    html[data-theme="papier"] .ways-card  { box-shadow: 6px 6px 0 0 var(--pt-plum); }
    html[data-theme="papier"] .habit-card { box-shadow: 6px 6px 0 0 var(--pt-mint); }

    html[data-theme="papier"] .ways-eyebrow,
    html[data-theme="papier"] .habit-eyebrow,
    html[data-theme="papier"] .ways-item-name,
    html[data-theme="papier"] .habit-toggle,
    html[data-theme="papier"] .ways-chip {
      font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      letter-spacing: 0.16em;
    }
    html[data-theme="papier"] .ways-eyebrow  { color: var(--pt-plum); }
    html[data-theme="papier"] .habit-eyebrow { color: var(--pt-mint); }
    html[data-theme="papier"] .ways-item-name {
      font-weight: 800; letter-spacing: 0.12em; color: #161616;
    }

    /* Solid pastel chips, white uppercase label. */
    html[data-theme="papier"] .ways-chip   { color: #ffffff; letter-spacing: 0.10em; }
    html[data-theme="papier"] .ways-chip-0 { background: var(--pt-indigo); }
    html[data-theme="papier"] .ways-chip-1 { background: var(--pt-rose); }
    html[data-theme="papier"] .ways-chip-2 { background: var(--pt-plum); }

    /* No lines — whitespace separates the three items instead. */
    html[data-theme="papier"] .ways-item { border-top: none; padding: 7px 0; }

    html[data-theme="papier"] .ways-intro,
    html[data-theme="papier"] .ways-item-def,
    html[data-theme="papier"] .habit-line { color: #444; }

    html[data-theme="papier"] .habit-toggle {
      border: 1px solid #161616;
      border-radius: 999px;
      color: #777;
      letter-spacing: 0.08em;
      transition: background 0.15s, color 0.15s, transform 0.08s;
    }
    html[data-theme="papier"] .habit-toggle:hover  { transform: translateY(-1px); }
    html[data-theme="papier"] .habit-toggle:active { transform: scale(0.96); }
    html[data-theme="papier"] .habit-toggle.on {
      background: var(--pt-mint);
      border-color: #161616;
      color: #ffffff;
    }
    html[data-theme="papier"] .habit-toggle.on .habit-check { color: #ffffff; }

    /* ── HERO PANEL ── groups greeting + "remember this" on the gradient.
       In the default theme .pt-hero is display:contents (invisible wrapper). */
    .pt-hero { display: contents; }
    html[data-theme="papier"] .pt-hero {
      display: block;
      background: var(--pt-holo);
      border-radius: 16px;
      padding: 22px 18px 26px;
      margin-bottom: 30px;
    }
    html[data-theme="papier"] .pt-hero .greeting         { margin-bottom: 18px; }
    html[data-theme="papier"] .pt-hero .remember-section { margin-bottom: 0; }
    html[data-theme="papier"] .pt-hero .remember-rule    { display: none; }

    /* Grotesque type in place of the serif */
    html[data-theme="papier"] body,
    html[data-theme="papier"] textarea,
    html[data-theme="papier"] .card-name,
    html[data-theme="papier"] .letter-badge,
    html[data-theme="papier"] .greeting,
    html[data-theme="papier"] .remember-line1,
    html[data-theme="papier"] .remember-line2 {
      font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    }

    /* Heavy editorial headlines, no italics */

      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');

      return `${y}-${m}-${day}`;
